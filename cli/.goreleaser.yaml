version: 2
project_name: husonym
before:
  hooks:
    - go mod tidy # https://goreleaser.com/customization/builds/#go-modules
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

    ldflags:
      - -s -w -X 'github.com/fishtre-compagnie/husonym/cli/internal/version.buildDate={{.Date}}' -X 'github.com/fishtre-compagnie/husonym/cli/internal/version.gitCommit={{.Commit}}' -X 'github.com/fishtre-compagnie/husonym/cli/internal/version.gitVersion={{.Version}}' -X 'github.com/fishtre-compagnie/husonym/cli/internal/auth.defaultBaseUrl={{ .Env.HUSONYM_BASE_URL }}'

    main: ./cmd/husonym

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    # Used by GH Action to sign with a specific fingerprint
    args:
      [
        "--batch",
        "-u",
        "{{ .Env.GPG_FINGERPRINT }}",
        "--output",
        "${signature}",
        "--detach-sign",
        "${artifact}",
      ]
snapshot:
  name_template: "{{ incpatch .Version }}-next"
changelog:
  disable: "{{ .Env.DISABLE_CHANGELOG }}"
  use: github-native
  sort: desc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

