openapi: 3.1.0
info:
  summary: Husonym API
  description: API documentation for mgmt.v1alpha1
  version: "0.5"
  termsOfService: "https://husonym.com/terms-of-service"
  contact:
    name: Husonym Support
    email: support@husonym.com
  license:
    name: MIT
    url: https://github.com/fishtre-compagnie/husonym/blob/main/LICENSE.md
  title: mgmt.v1alpha1
externalDocs:
  description: API and SDK Documentation
  url: https://docs.husonym.com/api
servers:
  - url: https://husonym-api.svcs.husonym.com
    description: Husonym Cloud
  - url: http://localhost:{port}
    description: Development
    variables:
      port:
        default: "8080"
        description: The port to use for the development server
components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.ListValue:
      type: array
      items:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON array whose elements may be any JSON value.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        Represents a JSON `null`.

         `NullValue` is a sentinel, using an enum with only one value to represent
         the null value for the `Value` type union.

         A field of type `NullValue` with any value other than `0` is considered
         invalid. Most ProtoJSON serializers will emit a Value with a `null_value` set
         as a JSON `null` regardless of the integer value, and so will round trip to
         a `0` value.
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON object whose property values may be any JSON value.
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
    mgmt.v1alpha1.AwsDynamoDBStreamConfig:
      type: object
      title: AwsDynamoDBStreamConfig
      additionalProperties: false
    mgmt.v1alpha1.AwsS3SchemaConfig:
      type: object
      anyOf:
        - type: object
          properties:
            jobId:
              type: string
              title: job_id
              format: uuid
              description: The unique identifier of the job to get the schema for.
          title: job_id
        - type: object
          properties:
            jobRunId:
              type: string
              title: job_run_id
              minLength: 1
              description: The unique identifier of the job run to get the schema for.
          title: job_run_id
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - jobId
              - required:
                  - jobRunId
          - not:
              oneOf:
                - required:
                    - jobId
                - required:
                    - jobRunId
      title: AwsS3SchemaConfig
    mgmt.v1alpha1.AwsS3StreamConfig:
      type: object
      anyOf:
        - type: object
          properties:
            jobId:
              type: string
              title: job_id
              format: uuid
              description: The unique identifier of the job to get the data stream for.
          title: job_id
        - type: object
          properties:
            jobRunId:
              type: string
              title: job_run_id
              minLength: 1
              description: The unique identifier of the job run to get the data stream for.
          title: job_run_id
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - jobId
              - required:
                  - jobRunId
          - not:
              oneOf:
                - required:
                    - jobId
                - required:
                    - jobRunId
      title: AwsS3StreamConfig
    mgmt.v1alpha1.ColumnPiiDetection:
      type: object
      properties:
        schema:
          type: string
          title: schema
        table:
          type: string
          title: table
        column:
          type: string
          title: column
        entityType:
          type: string
          title: entity_type
          description: 'Dominant Presidio entity type detected (ex: EMAIL_ADDRESS). Empty if none.'
        score:
          type: number
          title: score
          format: float
          description: Average score of the detected entity in [0,1].
        suggestedTransformerSource:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerSource'
          title: suggested_transformer_source
          description: Recommended transformer for this entity.
        isSensitive:
          type: boolean
          title: is_sensitive
          description: True if the column is considered personal data (GDPR).
        matchCount:
          type: integer
          title: match_count
          description: Number of sampled values in which the entity was found.
        sampledCount:
          type: integer
          title: sampled_count
          description: Total number of non-empty sampled values analyzed.
        dataCategory:
          type: string
          title: data_category
          description: 'Catégorie sémantique déduite de l''entité (ex: "email", "nir"). Alimente le libellé du badge.'
        piiConfidence:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiConfidence'
          title: pii_confidence
          description: |-
            Niveau de confiance. Une détection issue d'une clé de contrôle est CONFIRMED,
             une détection Presidio est NEEDS_REVIEW.
        piiDetectionMethod:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiDetectionMethod'
          title: pii_detection_method
          description: Comment la détection a été obtenue.
        piiEvidence:
          type: string
          title: pii_evidence
          description: Détail lisible de la preuve, pour l'infobulle.
      title: ColumnPiiDetection
      additionalProperties: false
      description: PII detected in a column by analyzing sampled content (Presidio).
    mgmt.v1alpha1.ColumnSampleValue:
      type: object
      properties:
        value:
          type: string
          title: value
          description: Représentation textuelle de la valeur. Vide si is_null.
        isNull:
          type: boolean
          title: is_null
          description: |-
            Distingue un NULL d'une chaîne vide — la différence compte pour juger d'une
             colonne (« vide » et « absent » ne se traitent pas pareil).
      title: ColumnSampleValue
      additionalProperties: false
    mgmt.v1alpha1.ColumnTransformerPreview:
      type: object
      properties:
        input:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.ColumnSampleValue'
          title: input
          description: The value as read from the source.
        output:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.ColumnSampleValue'
            - type: "null"
          title: output
          description: What the transformer produced. Unset when it failed on this value.
        error:
          type:
            - string
            - "null"
          title: error
          description: Why the transformer failed on this value, when it did.
      title: ColumnTransformerPreview
      additionalProperties: false
      description: One sampled value and what the transformer made of it.
    mgmt.v1alpha1.ConnectionSchemaConfig:
      type: object
      allOf:
        - oneOf:
            - required:
                - pgConfig
            - required:
                - awsS3Config
            - required:
                - mysqlConfig
            - required:
                - mongoConfig
            - required:
                - gcpCloudstorageConfig
            - required:
                - dynamodbConfig
            - required:
                - mssqlConfig
      anyOf:
        - type: object
          properties:
            awsS3Config:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.AwsS3SchemaConfig'
              title: aws_s3_config
          title: aws_s3_config
        - type: object
          properties:
            dynamodbConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.DynamoDBSchemaConfig'
              title: dynamodb_config
          title: dynamodb_config
        - type: object
          properties:
            gcpCloudstorageConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.GcpCloudStorageSchemaConfig'
              title: gcp_cloudstorage_config
          title: gcp_cloudstorage_config
        - type: object
          properties:
            mongoConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.MongoSchemaConfig'
              title: mongo_config
          title: mongo_config
        - type: object
          properties:
            mssqlConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.MssqlSchemaConfig'
              title: mssql_config
          title: mssql_config
        - type: object
          properties:
            mysqlConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.MysqlSchemaConfig'
              title: mysql_config
          title: mysql_config
        - type: object
          properties:
            pgConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresSchemaConfig'
              title: pg_config
          title: pg_config
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - awsS3Config
              - required:
                  - dynamodbConfig
              - required:
                  - gcpCloudstorageConfig
              - required:
                  - mongoConfig
              - required:
                  - mssqlConfig
              - required:
                  - mysqlConfig
              - required:
                  - pgConfig
          - not:
              oneOf:
                - required:
                    - awsS3Config
                - required:
                    - dynamodbConfig
                - required:
                    - gcpCloudstorageConfig
                - required:
                    - mongoConfig
                - required:
                    - mssqlConfig
                - required:
                    - mysqlConfig
                - required:
                    - pgConfig
      title: ConnectionSchemaConfig
    mgmt.v1alpha1.ConnectionStreamConfig:
      type: object
      allOf:
        - oneOf:
            - required:
                - pgConfig
            - required:
                - awsS3Config
            - required:
                - mysqlConfig
            - required:
                - gcpCloudstorageConfig
            - required:
                - dynamodbConfig
      anyOf:
        - type: object
          properties:
            awsS3Config:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.AwsS3StreamConfig'
              title: aws_s3_config
          title: aws_s3_config
        - type: object
          properties:
            dynamodbConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.AwsDynamoDBStreamConfig'
              title: dynamodb_config
          title: dynamodb_config
        - type: object
          properties:
            gcpCloudstorageConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.GcpCloudStorageStreamConfig'
              title: gcp_cloudstorage_config
          title: gcp_cloudstorage_config
        - type: object
          properties:
            mysqlConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.MysqlStreamConfig'
              title: mysql_config
          title: mysql_config
        - type: object
          properties:
            pgConfig:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresStreamConfig'
              title: pg_config
          title: pg_config
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - awsS3Config
              - required:
                  - dynamodbConfig
              - required:
                  - gcpCloudstorageConfig
              - required:
                  - mysqlConfig
              - required:
                  - pgConfig
          - not:
              oneOf:
                - required:
                    - awsS3Config
                - required:
                    - dynamodbConfig
                - required:
                    - gcpCloudstorageConfig
                - required:
                    - mysqlConfig
                - required:
                    - pgConfig
      title: ConnectionStreamConfig
    mgmt.v1alpha1.DatabaseColumn:
      type: object
      properties:
        schema:
          type: string
          title: schema
          description: 'The database schema. Ex: public'
        table:
          type: string
          title: table
          description: The name of the table in the schema
        column:
          type: string
          title: column
          description: The name of the column
        dataType:
          type: string
          title: data_type
          description: The datatype of the column
        isNullable:
          type: string
          title: is_nullable
          description: The isNullable Flag of the column
        columnDefault:
          type:
            - string
            - "null"
          title: column_default
          description: The default value of the column if available
        generatedType:
          type:
            - string
            - "null"
          title: generated_type
          description: |-
            Populated if the column is generated. The value is the type of generated column it is. For example, postgres is 's' for stored
             May be other values in the future, or other DB providers may use a different value types.
        identityGeneration:
          type:
            - string
            - "null"
          title: identity_generation
          description: Populated if the column is an identity. The value is the type of the identity column it is. For example, postgres is 'd' for generated by default, or 'a' for generated always.
        characterMaximumLength:
          type:
            - integer
            - "null"
          title: character_maximum_length
          format: int32
          description: |-
            How many characters the column accepts, when its type bounds them. Absent for types that
             bound nothing. It cannot be read back from data_type: MySQL reports `varchar` there and
             keeps the length in column_type, so anything parsing data_type finds no bound on MySQL.
        dataCategory:
          type: string
          title: data_category
          description: 'Nature sémantique détectée pour cette colonne (heuristique nom+type SQL). Ex: "email", "phone_number", "person_full_name". Vide si rien de détecté.'
        isSensitive:
          type: boolean
          title: is_sensitive
          description: True si la colonne est considérée comme une donnée à caractère personnel (RGPD).
        suggestedTransformerSource:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerSource'
          title: suggested_transformer_source
          description: Transformer recommandé pour anonymiser cette colonne. TRANSFORMER_SOURCE_UNSPECIFIED si aucune suggestion.
        piiConfidence:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiConfidence'
          title: pii_confidence
          description: |-
            Niveau de confiance de la détection. Seul CONFIRMED autorise l'application
             automatique du transformer suggéré.
        piiDetectionMethod:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiDetectionMethod'
          title: pii_detection_method
          description: Comment la détection a été obtenue.
        piiEvidence:
          type: string
          title: pii_evidence
          description: |-
            Détail lisible de la preuve, pour l'infobulle. Ex: "clé NIR valide sur 18/18 valeurs",
             "format jj/mm/aaaa prouvé (14 valeurs avec jour > 12)", "format ambigu : jj/mm ou mm/jj".
      title: DatabaseColumn
      additionalProperties: false
    mgmt.v1alpha1.DatabaseTable:
      type: object
      properties:
        schema:
          type: string
          title: schema
          minLength: 1
          description: The schema of the table
        table:
          type: string
          title: table
          minLength: 1
          description: The table name
      title: DatabaseTable
      additionalProperties: false
    mgmt.v1alpha1.DetectPiiInConnectionDataRequest:
      type: object
      properties:
        connectionId:
          type: string
          title: connection_id
          format: uuid
          description: The unique identifier of the connection to scan.
        schema:
          type: string
          title: schema
          minLength: 1
          description: The schema of the table to scan.
        table:
          type: string
          title: table
          minLength: 1
          description: The table to scan.
        columns:
          type: array
          items:
            type: string
          title: columns
          description: Columns to analyze. Empty means every column of the table.
        sampleSize:
          type: integer
          title: sample_size
          description: Number of sampled values per column (default 20).
        scoreThreshold:
          type: number
          title: score_threshold
          format: float
          description: Presidio score threshold in [0,1] (default 0.5).
        language:
          type: string
          title: language
          description: 'Content language (ISO 639-1). Default: server default or "en".'
      title: DetectPiiInConnectionDataRequest
      additionalProperties: false
    mgmt.v1alpha1.DetectPiiInConnectionDataResponse:
      type: object
      properties:
        detections:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.ColumnPiiDetection'
          title: detections
      title: DetectPiiInConnectionDataResponse
      additionalProperties: false
    mgmt.v1alpha1.DynamoDBSchemaConfig:
      type: object
      title: DynamoDBSchemaConfig
      additionalProperties: false
    mgmt.v1alpha1.ForeignConstraint:
      type: object
      properties:
        foreignKey:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.ForeignKey'
          title: foreign_key
          description: The foreign key that is associated with the constraint
        columns:
          type: array
          items:
            type: string
          title: columns
          description: The columns that are part of the constraint
        notNullable:
          type: array
          items:
            type: boolean
          title: not_nullable
          description: The not nullable flag for each column
      title: ForeignConstraint
      additionalProperties: false
    mgmt.v1alpha1.ForeignConstraintTables:
      type: object
      properties:
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.ForeignConstraint'
          title: constraints
          description: A list of foreign key constraints
      title: ForeignConstraintTables
      additionalProperties: false
    mgmt.v1alpha1.ForeignKey:
      type: object
      properties:
        table:
          type: string
          title: table
          description: The table that the foreign key is associated with
        columns:
          type: array
          items:
            type: string
          title: columns
          description: The columns that are part of the foreign key
      title: ForeignKey
      additionalProperties: false
    mgmt.v1alpha1.GcpCloudStorageSchemaConfig:
      type: object
      anyOf:
        - type: object
          properties:
            jobId:
              type: string
              title: job_id
              format: uuid
              description: The unique identifier of the job to get the schema for.
          title: job_id
        - type: object
          properties:
            jobRunId:
              type: string
              title: job_run_id
              minLength: 1
              description: The unique identifier of the job run to get the schema for.
          title: job_run_id
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - jobId
              - required:
                  - jobRunId
          - not:
              oneOf:
                - required:
                    - jobId
                - required:
                    - jobRunId
      title: GcpCloudStorageSchemaConfig
    mgmt.v1alpha1.GcpCloudStorageStreamConfig:
      type: object
      anyOf:
        - type: object
          properties:
            jobId:
              type: string
              title: job_id
              format: uuid
              description: The unique identifier of the job to get the data stream for.
          title: job_id
        - type: object
          properties:
            jobRunId:
              type: string
              title: job_run_id
              minLength: 1
              description: The unique identifier of the job run to get the data stream for.
          title: job_run_id
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - jobId
              - required:
                  - jobRunId
          - not:
              oneOf:
                - required:
                    - jobId
                - required:
                    - jobRunId
      title: GcpCloudStorageStreamConfig
    mgmt.v1alpha1.GenerateBool:
      type: object
      title: GenerateBool
      additionalProperties: false
    mgmt.v1alpha1.GenerateBusinessName:
      type: object
      title: GenerateBusinessName
      additionalProperties: false
    mgmt.v1alpha1.GenerateCardNumber:
