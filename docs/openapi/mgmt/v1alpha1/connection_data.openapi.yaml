    mgmt.v1alpha1.PreviewColumnTransformerResponse:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.ColumnTransformerPreview'
          title: values
        distinctInputs:
          type: integer
          title: distinct_inputs
          description: |-
            Distinct non-null values in the sample, before and after. Fewer after than before means the
             transformer sends different values to the same one — which a column under a uniqueness
             constraint cannot take. It is a sign, never a proof: a sample this small says nothing
             certain about the whole table.
        distinctOutputs:
          type: integer
          title: distinct_outputs
      title: PreviewColumnTransformerResponse
      additionalProperties: false
