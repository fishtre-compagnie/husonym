  /mgmt.v1alpha1.ConnectionDataService/DetectPiiInConnectionData:
    post:
      tags:
        - mgmt.v1alpha1.ConnectionDataService
      summary: DetectPiiInConnectionData
      description: |-
        Scans sampled column content through Presidio to detect PII (deep scan).
         Complements the name-based heuristic returned by GetConnectionSchema.
      operationId: mgmt.v1alpha1.ConnectionDataService.DetectPiiInConnectionData
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mgmt.v1alpha1.DetectPiiInConnectionDataRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mgmt.v1alpha1.DetectPiiInConnectionDataResponse'
