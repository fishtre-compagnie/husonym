    mgmt.v1alpha1.GenerateFirstName:
      type: object
      title: GenerateFirstName
      additionalProperties: false
    mgmt.v1alpha1.GenerateFloat64:
      type: object
      properties:
        randomizeSign:
          type:
            - boolean
            - "null"
          title: randomize_sign
