    mgmt.v1alpha1.GetJavascriptDraftPromptRequest:
      type: object
      properties:
        connectionId:
          type: string
          title: connection_id
          format: uuid
          description: The connection whose schema describes the column.
        schema:
          type: string
          title: schema
          minLength: 1
          description: The schema of the table.
        table:
          type: string
          title: table
          minLength: 1
          description: The table the column belongs to.
        column:
          type: string
          title: column
          minLength: 1
          description: The column a rule is being drafted for.
        mode:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.JavascriptDraftMode'
          title: mode
          description: What the rule derives its output from. Defaults to transform.
        engine:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.JavascriptDraftEngine'
          title: engine
          description: |-
            The engine that will run it. Unspecified means athanor — a product choice, not the
             deployment's state: ENABLE_ATHANOR_ENGINE is off by default and only the worker reads it,
             so the server cannot observe which engine a job will get. Athanor is where the product is
             going and Benthos is on its way out, so a caller on a Benthos deployment says so.
      title: GetJavascriptDraftPromptRequest
      additionalProperties: false
    mgmt.v1alpha1.GetJavascriptDraftPromptResponse:
      type: object
      properties:
        prompt:
          type: string
          title: prompt
          description: |-
            The prompt, ready to send to a model. It carries the execution contract, the column's
             constraints and the functions in scope — never any of the column's values.
      title: GetJavascriptDraftPromptResponse
      additionalProperties: false
