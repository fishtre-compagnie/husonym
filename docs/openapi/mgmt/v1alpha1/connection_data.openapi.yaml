          type: string
          title: column
          minLength: 1
          description: The column whose values are transformed.
        transformer:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerConfig'
          title: transformer
          description: The transformer to try on them.
