      additionalProperties: false
    mgmt.v1alpha1.TransformPiiText:
      type: object
      properties:
        scoreThreshold:
          type: number
          title: score_threshold
          format: float
          description: Minimal detection score for determining PII. 0.0-1.0
        defaultAnonymizer:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer'
          title: default_anonymizer
          description: The default anonmyization config used for all instances of detected PII.
        denyRecognizers:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.PiiDenyRecognizer'
          title: deny_recognizers
          description: Configure deny lists where each word is treated as PII.
        allowedEntities:
          type: array
          items:
            type: string
            minLength: 1
          title: allowed_entities
          description: |-
            Configure a list of entities to be used for PII analysis. If not provided or empty, all entities are considiered
             If this is specified, any ad-hoc, or deny_recognizers entity names must also be provided.
             To see available builtin entities, call the GetPiiTextEntities() RPC method to see what is available for your account.
        allowedPhrases:
          type: array
          items:
            type: string
          title: allowed_phrases
          description: Exact match of PII phrases identified by the analysis engine.
        language:
          type:
            - string
            - "null"
          title: language
          description: |-
            Two characters for the desired language in ISO_639-1 format.
             If not provided, will use a default language if specified on the server.
             Depending on the server configuration, may attempt to autodetect from input.
        entityAnonymizers:
          type: object
          title: entity_anonymizers
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer'
            title: value
          description: |-
            A map of entity names to anonymizer configurations.
             The key in this map corresponds to a recognized entity (e.g. PERSON, PHONE_NUMBER) which can be found via the GetPiiTextEntities() RPC method.
             The value in this map corresponds to the anonymizer configuration to use for that entity.
             If not provided, the default_anonymizer will be used.
      title: TransformPiiText
      additionalProperties: false
      description: HusonymCloud/Enterprise only transformer for anonymizing PII Text
    mgmt.v1alpha1.TransformScrambleIdentity:
      type: object
      title: TransformScrambleIdentity
      additionalProperties: false
      description: |-
        Takes an input integer and scrambles it, effectively outputing another integer that is not the same as the input.
         This is effectively a random integer generator that has unique properties.
