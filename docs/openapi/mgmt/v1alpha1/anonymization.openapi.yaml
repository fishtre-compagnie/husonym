openapi: 3.1.0
info:
  summary: Husonym API
  description: API documentation for mgmt.v1alpha1
  version: "0.5"
  termsOfService: "https://husonym.com/terms-of-service"
  contact:
    name: Husonym Support
    email: support@husonym.com
  license:
    name: MIT
    url: https://github.com/fishtre-compagnie/husonym/blob/main/LICENSE.md
  title: mgmt.v1alpha1
externalDocs:
  description: API and SDK Documentation
  url: https://docs.husonym.com/api
servers:
  - url: https://husonym-api.svcs.husonym.com
    description: Husonym Cloud
  - url: http://localhost:{port}
    description: Development
    variables:
      port:
        default: "8080"
        description: The port to use for the development server
components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    mgmt.v1alpha1.AnonymizeManyErrors:
      type: object
      properties:
        inputIndex:
          type: string
          title: input_index
          format: int64
          description: Index of input data that caused error
        errorMessage:
          type: string
          title: error_message
          description: Error message
      title: AnonymizeManyErrors
      additionalProperties: false
    mgmt.v1alpha1.AnonymizeManyRequest:
      type: object
      properties:
        inputData:
          type: array
          items:
            type: string
            minLength: 1
          title: input_data
          maxItems: 25
          minItems: 1
          description: Array of stringified JSON data to be anonymized (up to 25 items)
        transformerMappings:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.TransformerMapping'
          title: transformer_mappings
          description: Array of Transformer mappings
        defaultTransformers:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.DefaultTransformersConfig'
            - type: "null"
          title: default_transformers
          description: Optional default transformations for any unmapped keys
        haltOnFailure:
          type: boolean
          title: halt_on_failure
          description: |-
            Flag to indicate whether to stop processing when an error occurs
             true: stops on first error encounter
        accountId:
          type: string
          title: account_id
          format: uuid
          description: The unique account identifier
      title: AnonymizeManyRequest
      additionalProperties: false
    mgmt.v1alpha1.AnonymizeManyResponse:
      type: object
      properties:
        outputData:
          type: array
          items:
            type: string
          title: output_data
          description: Array of anonymized JSON data
        errors:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.AnonymizeManyErrors'
          title: errors
          description: Array of errors that occured during anonymization
      title: AnonymizeManyResponse
      additionalProperties: false
    mgmt.v1alpha1.AnonymizeSingleRequest:
      type: object
      properties:
        inputData:
          type: string
          title: input_data
          description: Stringified JSON data to be anonymized
        transformerMappings:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.TransformerMapping'
          title: transformer_mappings
          description: Array of Transformer mappings
        defaultTransformers:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.DefaultTransformersConfig'
            - type: "null"
          title: default_transformers
          description: Optional default transformations for any unmapped keys
        accountId:
          type: string
          title: account_id
          format: uuid
          description: The unique account identifier
      title: AnonymizeSingleRequest
      additionalProperties: false
    mgmt.v1alpha1.AnonymizeSingleResponse:
      type: object
      properties:
        outputData:
          type: string
          title: output_data
          description: Anonymized JSON data
      title: AnonymizeSingleResponse
      additionalProperties: false
    mgmt.v1alpha1.DefaultTransformersConfig:
      type: object
      properties:
        boolean:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerConfig'
          title: boolean
          description: Any identified boolean value will be transformed using this configuration if no mapping is found.
        n:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerConfig'
          title: n
          description: Any identified number value will be transformed using this configuration if no mapping is found.
        s:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerConfig'
          title: s
          description: Any identified string value will be transformed using this configuration if no mapping is found.
      title: DefaultTransformersConfig
      additionalProperties: false
    mgmt.v1alpha1.GenerateBool:
      type: object
      title: GenerateBool
      additionalProperties: false
    mgmt.v1alpha1.GenerateBusinessName:
      type: object
      title: GenerateBusinessName
      additionalProperties: false
    mgmt.v1alpha1.GenerateCardNumber:
      type: object
      properties:
        validLuhn:
          type:
            - boolean
            - "null"
          title: valid_luhn
          description: Whether or not to validate the card number using the Luhn algorithm.
      title: GenerateCardNumber
      additionalProperties: false
    mgmt.v1alpha1.GenerateCategorical:
      type: object
      properties:
        categories:
          type:
            - string
            - "null"
          title: categories
          description: A comma separated list of categories that will be used to generate a random value from.
      title: GenerateCategorical
      additionalProperties: false
    mgmt.v1alpha1.GenerateCity:
      type: object
      title: GenerateCity
      additionalProperties: false
    mgmt.v1alpha1.GenerateCountry:
      type: object
      properties:
        generateFullName:
          type:
            - boolean
            - "null"
          title: generate_full_name
          description: An option to return the full country name of the randomly selected country or return the default of a 2-letter country code.
      title: GenerateCountry
      additionalProperties: false
    mgmt.v1alpha1.GenerateDefault:
      type: object
      title: GenerateDefault
      additionalProperties: false
    mgmt.v1alpha1.GenerateE164PhoneNumber:
      type: object
      properties:
        min:
          type:
            - string
            - "null"
          title: min
          format: int64
          description: The minimum length of the phone number to generate.
        max:
          type:
            - string
            - "null"
          title: max
          format: int64
          description: The maximum length of the phone number to generate.
      title: GenerateE164PhoneNumber
      additionalProperties: false
    mgmt.v1alpha1.GenerateEmail:
      type: object
      properties:
        emailType:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.GenerateEmailType'
            - type: "null"
          title: email_type
          description: Optionally specify the type of email to generate. The types specified determine the contents on the left side of the @.
      title: GenerateEmail
      additionalProperties: false
    mgmt.v1alpha1.GenerateEmailType:
      type: string
      title: GenerateEmailType
      enum:
        - GENERATE_EMAIL_TYPE_UNSPECIFIED
        - GENERATE_EMAIL_TYPE_UUID_V4
        - GENERATE_EMAIL_TYPE_FULLNAME
    mgmt.v1alpha1.GenerateFirstName:
      type: object
      title: GenerateFirstName
      additionalProperties: false
    mgmt.v1alpha1.GenerateFloat64:
      type: object
      properties:
        randomizeSign:
          type:
            - boolean
            - "null"
          title: randomize_sign
          description: Whether or not to randomize the sign of the float64.
        min:
          type:
            - number
            - "null"
          title: min
          format: double
          description: The minimum value to randomize the float64 to.
        max:
          type:
            - number
            - "null"
          title: max
          format: double
          description: The maximum value to randomize the float64 to.
        precision:
          type:
            - string
            - "null"
          title: precision
          format: int64
          description: The precision of the float64 to generate.
      title: GenerateFloat64
      additionalProperties: false
    mgmt.v1alpha1.GenerateFullAddress:
      type: object
      title: GenerateFullAddress
      additionalProperties: false
    mgmt.v1alpha1.GenerateFullName:
      type: object
      title: GenerateFullName
      additionalProperties: false
    mgmt.v1alpha1.GenerateGender:
      type: object
      properties:
        abbreviate:
          type:
            - boolean
            - "null"
          title: abbreviate
          description: Whether or not to abbreviate the gender.
      title: GenerateGender
      additionalProperties: false
    mgmt.v1alpha1.GenerateInt64:
      type: object
      properties:
        randomizeSign:
          type:
            - boolean
            - "null"
          title: randomize_sign
          description: Whether or not to randomize the sign of the int64.
        min:
          type:
            - string
            - "null"
          title: min
          format: int64
          description: The minimum value to randomize the int64 to.
        max:
          type:
            - string
            - "null"
          title: max
          format: int64
          description: The maximum value to randomize the int64 to.
      title: GenerateInt64
      additionalProperties: false
    mgmt.v1alpha1.GenerateInt64PhoneNumber:
      type: object
      title: GenerateInt64PhoneNumber
      additionalProperties: false
    mgmt.v1alpha1.GenerateIpAddress:
      type: object
      properties:
        ipType:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.GenerateIpAddressType'
            - type: "null"
          title: ip_type
          description: Optionally specify the type of ip address to generate.
      title: GenerateIpAddress
      additionalProperties: false
    mgmt.v1alpha1.GenerateIpAddressType:
      type: string
      title: GenerateIpAddressType
      enum:
        - GENERATE_IP_ADDRESS_TYPE_UNSPECIFIED
        - GENERATE_IP_ADDRESS_TYPE_V4_PUBLIC
        - GENERATE_IP_ADDRESS_TYPE_V4_PRIVATE_A
        - GENERATE_IP_ADDRESS_TYPE_V4_PRIVATE_B
        - GENERATE_IP_ADDRESS_TYPE_V4_PRIVATE_C
        - GENERATE_IP_ADDRESS_TYPE_V4_LINK_LOCAL
        - GENERATE_IP_ADDRESS_TYPE_V4_MULTICAST
        - GENERATE_IP_ADDRESS_TYPE_V4_LOOPBACK
        - GENERATE_IP_ADDRESS_TYPE_V6
    mgmt.v1alpha1.GenerateJavascript:
      type: object
      properties:
        code:
          type: string
          title: code
          description: The user provided javascript code that will be executed in the transformer
      title: GenerateJavascript
      additionalProperties: false
    mgmt.v1alpha1.GenerateLastName:
      type: object
      title: GenerateLastName
      additionalProperties: false
    mgmt.v1alpha1.GenerateSSN:
      type: object
      title: GenerateSSN
      additionalProperties: false
    mgmt.v1alpha1.GenerateSha256Hash:
      type: object
      title: GenerateSha256Hash
      additionalProperties: false
    mgmt.v1alpha1.GenerateState:
      type: object
      properties:
        generateFullName:
          type:
            - boolean
            - "null"
          title: generate_full_name
          description: An option to return the full state name of the randomly selected state or return the default of a 2-letter state code.
      title: GenerateState
      additionalProperties: false
    mgmt.v1alpha1.GenerateStreetAddress:
      type: object
      title: GenerateStreetAddress
      additionalProperties: false
    mgmt.v1alpha1.GenerateString:
      type: object
      properties:
        min:
          type:
            - string
            - "null"
          title: min
          format: int64
          description: The minimum length of the string to generate.
        max:
          type:
            - string
            - "null"
          title: max
          format: int64
          description: The maximum length of the string to generate.
      title: GenerateString
      additionalProperties: false
    mgmt.v1alpha1.GenerateStringPhoneNumber:
      type: object
      properties:
        min:
          type:
            - string
            - "null"
          title: min
          format: int64
          description: The minimum length of the phone number to generate.
        max:
          type:
            - string
            - "null"
          title: max
          format: int64
          description: The maximum length of the phone number to generate.
      title: GenerateStringPhoneNumber
      additionalProperties: false
    mgmt.v1alpha1.GenerateUnixTimestamp:
      type: object
      title: GenerateUnixTimestamp
      additionalProperties: false
    mgmt.v1alpha1.GenerateUsername:
      type: object
      title: GenerateUsername
      additionalProperties: false
    mgmt.v1alpha1.GenerateUtcTimestamp:
      type: object
      title: GenerateUtcTimestamp
      additionalProperties: false
    mgmt.v1alpha1.GenerateUuid:
      type: object
      properties:
        includeHyphens:
          type:
            - boolean
            - "null"
          title: include_hyphens
          description: Whether or not to include hyphens in the uuid. Defaults to true. If false, the uuid will be returned without hyphens.
      title: GenerateUuid
      additionalProperties: false
    mgmt.v1alpha1.GenerateZipcode:
      type: object
      title: GenerateZipcode
      additionalProperties: false
    mgmt.v1alpha1.InvalidEmailAction:
      type: string
      title: InvalidEmailAction
      enum:
        - INVALID_EMAIL_ACTION_UNSPECIFIED
        - INVALID_EMAIL_ACTION_REJECT
        - INVALID_EMAIL_ACTION_NULL
        - INVALID_EMAIL_ACTION_PASSTHROUGH
        - INVALID_EMAIL_ACTION_GENERATE
      description: Action enumeration that dictates what the transform_email transformer should do in the case that it encounters an email that does not conform to RFC 5322
    mgmt.v1alpha1.Null:
      type: object
      title: "Null"
      additionalProperties: false
    mgmt.v1alpha1.Passthrough:
      type: object
      title: Passthrough
      additionalProperties: false
    mgmt.v1alpha1.PiiAnonymizer:
      type: object
      anyOf:
        - type: object
          properties:
            hash:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Hash'
              title: hash
              description: Configures the anonymizer to hash the identified PII
          title: hash
        - type: object
          properties:
            mask:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Mask'
              title: mask
              description: Configures the anonymizer to mask the identified PII
          title: mask
        - type: object
          properties:
            redact:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Redact'
              title: redact
              description: Configures the anonymizer to completely remove the identified PII
          title: redact
        - type: object
          properties:
            replace:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Replace'
              title: replace
              description: Configures the anonymizer to replace the identified PII with a specific value
          title: replace
        - type: object
          properties:
            transform:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Transform'
              title: transform
              description: Configures the anonymizer to use a Husonym configured transformer
          title: transform
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - hash
              - required:
                  - mask
              - required:
                  - redact
              - required:
                  - replace
              - required:
                  - transform
          - not:
              oneOf:
                - required:
                    - hash
                - required:
                    - mask
                - required:
                    - redact
                - required:
                    - replace
                - required:
                    - transform
      title: PiiAnonymizer
    mgmt.v1alpha1.PiiAnonymizer.Hash:
      type: object
      properties:
        algo:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Hash.HashType'
            - type: "null"
          title: algo
          description: The hashing algorithm to use.
      title: Hash
      additionalProperties: false
    mgmt.v1alpha1.PiiAnonymizer.Hash.HashType:
      type: string
      title: HashType
      enum:
        - HASH_TYPE_UNSPECIFIED
        - HASH_TYPE_MD5
        - HASH_TYPE_SHA256
        - HASH_TYPE_SHA512
    mgmt.v1alpha1.PiiAnonymizer.Mask:
      type: object
      properties:
        maskingChar:
          type:
            - string
            - "null"
          title: masking_char
          description: Provide a character that will be used for the replacement.
        charsToMask:
          type:
            - integer
            - "null"
          title: chars_to_mask
          format: int32
          description: How many characters to mask.
        fromEnd:
          type:
            - boolean
            - "null"
          title: from_end
          description: Whether to mask the PII from start or end
      title: Mask
      additionalProperties: false
    mgmt.v1alpha1.PiiAnonymizer.Redact:
      type: object
      title: Redact
      additionalProperties: false
    mgmt.v1alpha1.PiiAnonymizer.Replace:
      type: object
      properties:
        value:
          type:
            - string
            - "null"
          title: value
          description: 'The value to replace. If not provided, a template token of the anonymizer is used (e.g. A PERSON entity is replaced with: <PERSON>)'
      title: Replace
      additionalProperties: false
    mgmt.v1alpha1.PiiAnonymizer.Transform:
      type: object
      properties:
        config:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerConfig'
          title: config
          description: The transformer to use. If not provided, a transformer will automatically be selected (if supported), otherwise it falls back to generating a random hash.
      title: Transform
      additionalProperties: false
    mgmt.v1alpha1.PiiDenyRecognizer:
      type: object
      properties:
        name:
          type: string
          title: name
          pattern: ^[a-z0-9-_]{1,100}$
          description: Friendly name of this entity
        denyWords:
          type: array
          items:
            type: string
            minLength: 1
          title: deny_words
          description: List of words that will be treated as PII.
      title: PiiDenyRecognizer
      additionalProperties: false
    mgmt.v1alpha1.TransformCharacterScramble:
      type: object
      properties:
        userProvidedRegex:
          type:
            - string
            - "null"
          title: user_provided_regex
          description: A user provided regular expression that will be used to scramble the characters in the input string. Must be a valid Golang regex.
      title: TransformCharacterScramble
      additionalProperties: false
    mgmt.v1alpha1.TransformE164PhoneNumber:
      type: object
      properties:
        preserveLength:
          type:
            - boolean
            - "null"
          title: preserve_length
          description: Whether or not to preserve the original length of the phone number. This causes the transformed phone number to retain the original length.
      title: TransformE164PhoneNumber
      additionalProperties: false
    mgmt.v1alpha1.TransformEmail:
      type: object
      properties:
        preserveDomain:
          type:
            - boolean
            - "null"
          title: preserve_domain
          description: Whether or not to preserve the original domain, barring what has been specified in the excluded_domains property.
        preserveLength:
          type:
            - boolean
            - "null"
          title: preserve_length
          description: Whether or not to preserve the original length of the email. This causes the transformed email to retain the original length.
        excludedDomains:
          type: array
          items:
            type: string
          title: excluded_domains
          description: A lsit of email domains that should be excluded. This changes based on the preserve_domain flag. See the docs for more details.
        emailType:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.GenerateEmailType'
            - type: "null"
          title: email_type
          description: Optionally specify the type of email to generate. The types specified determine the contents on the left side of the @.
        invalidEmailAction:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.InvalidEmailAction'
            - type: "null"
          title: invalid_email_action
          description: Optionally specify an action in the result of an invalid email. An invalid email is one that does not conform to RFC 5322.
      title: TransformEmail
      additionalProperties: false
    mgmt.v1alpha1.TransformFirstName:
      type: object
      properties:
        preserveLength:
          type:
            - boolean
            - "null"
          title: preserve_length
          description: Whether or not to preserve the original length of the first name. This causes the transformed first name to retain the original length.
      title: TransformFirstName
      additionalProperties: false
    mgmt.v1alpha1.TransformFloat64:
      type: object
      properties:
        randomizationRangeMin:
          type:
            - number
            - "null"
          title: randomization_range_min
          format: double
          description: The minimum value to randomize the float64 to. This will be relative to the original value.
        randomizationRangeMax:
          type:
            - number
            - "null"
          title: randomization_range_max
          format: double
          description: The maximum value to randomize the float64 to. This will be relative to the original value.
      title: TransformFloat64
      additionalProperties: false
    mgmt.v1alpha1.TransformFullName:
      type: object
      properties:
        preserveLength:
          type:
            - boolean
            - "null"
          title: preserve_length
          description: Whether or not to preserve the original length of the full name. This causes the transformed full name to retain the original length.
      title: TransformFullName
      additionalProperties: false
    mgmt.v1alpha1.TransformInt64:
      type: object
      properties:
        randomizationRangeMin:
          type:
            - string
            - "null"
          title: randomization_range_min
          format: int64
          description: The minimum value to randomize the int64 to. This will be relative to the original value.
        randomizationRangeMax:
          type:
            - string
            - "null"
          title: randomization_range_max
          format: int64
          description: The maximum value to randomize the int64 to. This will be relative to the original value.
      title: TransformInt64
      additionalProperties: false
    mgmt.v1alpha1.TransformInt64PhoneNumber:
      type: object
      properties:
        preserveLength:
          type:
            - boolean
            - "null"
          title: preserve_length
          description: Whether or not to preserve the original length of the phone number. This causes the transformed phone number to retain the original length.
      title: TransformInt64PhoneNumber
      additionalProperties: false
    mgmt.v1alpha1.TransformJavascript:
      type: object
      properties:
        code:
          type: string
          title: code
          description: The user provided javascript code that will be executed in the transformer
      title: TransformJavascript
      additionalProperties: false
    mgmt.v1alpha1.TransformLastName:
      type: object
      properties:
        preserveLength:
          type:
            - boolean
            - "null"
          title: preserve_length
          description: Whether or not to preserve the original length of the last name. This causes the transformed last name to retain the original length.
      title: TransformLastName
      additionalProperties: false
    mgmt.v1alpha1.TransformPhoneNumber:
      type: object
      properties:
        preserveLength:
          type:
            - boolean
            - "null"
          title: preserve_length
          description: Whether or not to preserve the original length of the phone number. This causes the transformed phone number to retain the original length.
        preserveFormat:
          type:
            - boolean
            - "null"
          title: preserve_format
          description: 'Keeps the prefix (0 and the next digit, or + with the country code and the next digit), every separator and the length, and replaces the other digits with a keyed permutation: two distinct numbers never give the same output, and a number written in two formats (06…, +33 6…) gets the same digits. Implies preserve_length.'
      title: TransformPhoneNumber
      additionalProperties: false
    mgmt.v1alpha1.TransformPiiText:
      type: object
      properties:
        scoreThreshold:
          type: number
          title: score_threshold
          format: float
          description: Minimal detection score for determining PII. 0.0-1.0
        defaultAnonymizer:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer'
          title: default_anonymizer
          description: The default anonmyization config used for all instances of detected PII.
        denyRecognizers:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.PiiDenyRecognizer'
          title: deny_recognizers
          description: Configure deny lists where each word is treated as PII.
        allowedEntities:
          type: array
          items:
            type: string
            minLength: 1
          title: allowed_entities
          description: |-
            Configure a list of entities to be used for PII analysis. If not provided or empty, all entities are considiered
             If this is specified, any ad-hoc, or deny_recognizers entity names must also be provided.
             To see available builtin entities, call the GetPiiTextEntities() RPC method to see what is available for your account.
        allowedPhrases:
          type: array
          items:
            type: string
          title: allowed_phrases
          description: Exact match of PII phrases identified by the analysis engine.
        language:
          type:
            - string
            - "null"
          title: language
          description: |-
            Two characters for the desired language in ISO_639-1 format.
             If not provided, will use a default language if specified on the server.
             Depending on the server configuration, may attempt to autodetect from input.
        entityAnonymizers:
          type: object
          title: entity_anonymizers
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer'
            title: value
          description: |-
            A map of entity names to anonymizer configurations.
             The key in this map corresponds to a recognized entity (e.g. PERSON, PHONE_NUMBER) which can be found via the GetPiiTextEntities() RPC method.
             The value in this map corresponds to the anonymizer configuration to use for that entity.
             If not provided, the default_anonymizer will be used.
      title: TransformPiiText
      additionalProperties: false
      description: HusonymCloud/Enterprise only transformer for anonymizing PII Text
    mgmt.v1alpha1.TransformScrambleIdentity:
      type: object
      title: TransformScrambleIdentity
      additionalProperties: false
      description: |-
        Takes an input integer and scrambles it, effectively outputing another integer that is not the same as the input.
         This is effectively a random integer generator that has unique properties.
