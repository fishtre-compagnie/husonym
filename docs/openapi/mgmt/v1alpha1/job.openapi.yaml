          title: new_column_addition_strategy
          description: Provide a strategy of what to do in the event Husonym encounters an unmapped column for the job's mapped tables.
        columnRemovalStrategy:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy'
          title: column_removal_strategy
          description: Provide a strategy of what to do in the event Husonym encounters a column that is removed from the source table.
      title: PostgresSourceConnectionOptions
      additionalProperties: false
    mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy:
      type: object
      anyOf:
        - type: object
          properties:
            continueJob:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy.ContinueJob'
              title: continue_job
              description: continue job if a column is removed
          title: continue_job
        - type: object
          properties:
            haltJob:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy.HaltJob'
              title: halt_job
              description: halt job if a column is removed
          title: halt_job
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - continueJob
              - required:
                  - haltJob
          - not:
              oneOf:
                - required:
                    - continueJob
                - required:
                    - haltJob
      title: ColumnRemovalStrategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy.ContinueJob:
      type: object
      title: ContinueJob
      additionalProperties: false
      description: Configuration for the ContinueJob strategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy.HaltJob:
      type: object
      title: HaltJob
      additionalProperties: false
      description: Configuration for the HaltJob strategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy:
      type: object
      anyOf:
        - type: object
          properties:
            autoMap:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.AutoMap'
              title: auto_map
              description: |-
                automatically handle unmapped columns. It handles this by using the DBs default/nullable values.
                 If this doesn't exist, will fall back to configuring generators for supported datatypes.
                 If none of the criteria above can be met, the job run will fail to prevent leaking of PII.
          title: auto_map
        - type: object
          properties:
            haltJob:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.HaltJob'
              title: halt_job
              description: halt job if a new column is detected.
          title: halt_job
        - type: object
          properties:
            passthrough:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.Passthrough'
              title: passthrough
              description: pass the new column through as is.
          title: passthrough
        - type: object
          properties:
            passthroughPendingReview:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.PassthroughPendingReview'
              title: passthrough_pending_review
              description: |-
                pass the new column through as is, and record it as awaiting review.
                 The data path is the one of `passthrough`: the column is copied instead of stopping
                 the run — the destination gains it through schema reconciliation when Husonym
                 initializes its schema — and it counts as undecided until someone maps it or
                 acknowledges the passthrough, so a schema that keeps evolving cannot quietly erode
                 the anonymization of the job.
          title: passthrough_pending_review
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - autoMap
              - required:
                  - haltJob
              - required:
                  - passthrough
              - required:
                  - passthroughPendingReview
          - not:
              oneOf:
                - required:
                    - autoMap
                - required:
                    - haltJob
                - required:
                    - passthrough
                - required:
                    - passthroughPendingReview
      title: NewColumnAdditionStrategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.AutoMap:
      type: object
      title: AutoMap
      additionalProperties: false
      description: Configuration for the AutoMap strategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.HaltJob:
      type: object
      title: HaltJob
      additionalProperties: false
      description: Configuration for the HaltJob strategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.Passthrough:
