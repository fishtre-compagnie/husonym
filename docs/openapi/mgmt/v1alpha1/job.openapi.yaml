openapi: 3.1.0
info:
  summary: Husonym API
  description: API documentation for mgmt.v1alpha1
  version: "0.5"
  termsOfService: "https://husonym.com/terms-of-service"
  contact:
    name: Husonym Support
    email: support@husonym.com
  license:
    name: MIT
    url: https://github.com/fishtre-compagnie/husonym/blob/main/LICENSE.md
  title: mgmt.v1alpha1
externalDocs:
  description: API and SDK Documentation
  url: https://docs.husonym.com/api
servers:
  - url: https://husonym-api.svcs.husonym.com
    description: Husonym Cloud
  - url: http://localhost:{port}
    description: Development
    variables:
      port:
        default: "8080"
        description: The port to use for the development server
components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    mgmt.v1alpha1.ActivityFailure:
      type: object
      properties:
        message:
          type: string
          title: message
          description: The message of the failure
      title: ActivityFailure
      additionalProperties: false
    mgmt.v1alpha1.ActivityOptions:
      type: object
      properties:
        scheduleToCloseTimeout:
          type:
            - string
            - "null"
          title: schedule_to_close_timeout
          minimum: 1
          format: int64
          description: |-
            Total time that a workflow is willing to wait for an activity to complete, including retries.
             Measured in seconds
        startToCloseTimeout:
          type:
            - string
            - "null"
          title: start_to_close_timeout
          minimum: 1
          format: int64
          description: |-
            Max time of a single Temporal Activity execution attempt.
             This timeout should be as short as the longest psosible execution of any activity (e.g. table sync).
             Important to know that this is per retry attempt. Defaults to the schedule to close timeout if not provided.
             Measured in seconds
        retryPolicy:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.RetryPolicy'
          title: retry_policy
          description: |-
            Optionally define a retry policy for the activity
             If max attempts is not set, the activity will retry indefinitely until the start to close timeout lapses
      title: ActivityOptions
      additionalProperties: false
      description: Config that contains various timeouts that are configured in the underlying temporal workflow(s) and activities
    mgmt.v1alpha1.ActivityStatus:
      type: string
      title: ActivityStatus
      enum:
        - ACTIVITY_STATUS_UNSPECIFIED
        - ACTIVITY_STATUS_SCHEDULED
        - ACTIVITY_STATUS_STARTED
        - ACTIVITY_STATUS_CANCELED
        - ACTIVITY_STATUS_FAILED
    mgmt.v1alpha1.AiGenerateSourceOptions:
      type: object
      properties:
        aiConnectionId:
          type: string
          title: ai_connection_id
          format: uuid
          description: The connection id that corresponds with an AI-based Husonym connection
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.AiGenerateSourceSchemaOption'
          title: schemas
          minItems: 1
          description: The list of schemas (and their tables) along with any configuration options that will be used to generate data for.
        fkSourceConnectionId:
          type:
            - string
            - "null"
          title: fk_source_connection_id
          format: uuid
          description: An optional connection id that will be used as the basis for the shape of data to be generated.
        modelName:
          type: string
          title: model_name
          minLength: 1
          description: The name of the model to use
        userPrompt:
          type:
            - string
            - "null"
          title: user_prompt
          description: Optionally provide a user prompt to give more context to the schema
        generateBatchSize:
          type:
            - string
            - "null"
          title: generate_batch_size
          maximum: 100
          minimum: 1
          format: int64
          description: The batch size that will be used to generate X number of records. This is global and will be applied to all tables configured.
      title: AiGenerateSourceOptions
      additionalProperties: false
    mgmt.v1alpha1.AiGenerateSourceSchemaOption:
      type: object
      properties:
        schema:
          type: string
          title: schema
          minLength: 1
          description: The dataabase schema
        tables:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.AiGenerateSourceTableOption'
          title: tables
          minItems: 1
          description: The list of tables (and their configuration) that reside within the schema to receive generated data
      title: AiGenerateSourceSchemaOption
      additionalProperties: false
    mgmt.v1alpha1.AiGenerateSourceTableOption:
      type: object
      properties:
        table:
          type: string
          title: table
          minLength: 1
          description: The table that will be used to generate data for
        rowCount:
          type: string
          title: row_count
          maximum: 1000
          minimum: 1
          format: int64
          description: The total number of records to be generated.
      title: AiGenerateSourceTableOption
      additionalProperties: false
    mgmt.v1alpha1.AwsS3DestinationConnectionOptions:
      type: object
      properties:
        storageClass:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.AwsS3DestinationConnectionOptions.StorageClass'
          title: storage_class
          description: The storage class that will be used when objects are written to S3
        maxInFlight:
          type:
            - integer
            - "null"
          title: max_in_flight
          minimum: 1
          description: The maximum number of batched messages to have in flight at a given time. Increase this to improve throughput.
        timeout:
          type:
            - string
            - "null"
          title: timeout
          description: The maximum period (duration string) to wait on an upload before abandoning it and reattempting.
        batch:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.BatchConfig'
          title: batch
          description: Configure batching options to more efficiently store records in S3
      title: AwsS3DestinationConnectionOptions
      additionalProperties: false
    mgmt.v1alpha1.AwsS3DestinationConnectionOptions.StorageClass:
      type: string
      title: StorageClass
      enum:
        - STORAGE_CLASS_UNSPECIFIED
        - STORAGE_CLASS_STANDARD
        - STORAGE_CLASS_REDUCED_REDUNDANCY
        - STORAGE_CLASS_GLACIER
        - STORAGE_CLASS_STANDARD_IA
        - STORAGE_CLASS_ONEZONE_IA
        - STORAGE_CLASS_INTELLIGENT_TIERING
        - STORAGE_CLASS_DEEP_ARCHIVE
    mgmt.v1alpha1.AwsS3SourceConnectionOptions:
      type: object
      properties:
        connectionId:
          type: string
          title: connection_id
          format: uuid
          description: The unique connection id to a aws s3 connection configuration
      title: AwsS3SourceConnectionOptions
      additionalProperties: false
    mgmt.v1alpha1.BatchConfig:
      type: object
      properties:
        count:
          type:
            - integer
            - "null"
          title: count
          description: The max allowed in a batch before it is flushed. 0 to disable.
        period:
          type:
            - string
            - "null"
          title: period
          description: |-
            A duration string in which an incomplete batch should be flushed regardless of the count.
             Examples are 1s, 1m, 500ms
      title: BatchConfig
      additionalProperties: false
    mgmt.v1alpha1.CancelJobRunRequest:
      type: object
      properties:
        jobRunId:
          type: string
          title: job_run_id
          description: The unique identifier of the job run
        accountId:
          type: string
          title: account_id
          format: uuid
          description: The unique identifier of the account
      title: CancelJobRunRequest
      additionalProperties: false
    mgmt.v1alpha1.CancelJobRunResponse:
      type: object
      title: CancelJobRunResponse
      additionalProperties: false
    mgmt.v1alpha1.ColumnError:
      type: object
      properties:
        schema:
          type: string
          title: schema
          description: The schema of the table
        table:
          type: string
          title: table
          description: The table of the column
        column:
          type: string
          title: column
          description: The column of the error
        errorReports:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.ColumnError.ColumnErrorReport'
          title: error_reports
          description: The list of error reports
      title: ColumnError
      additionalProperties: false
    mgmt.v1alpha1.ColumnError.ColumnErrorCode:
      type: string
      title: ColumnErrorCode
      enum:
        - COLUMN_ERROR_CODE_UNSPECIFIED
        - COLUMN_ERROR_CODE_NOT_FOUND_IN_SOURCE
        - COLUMN_ERROR_CODE_NOT_FOUND_IN_MAPPING
        - COLUMN_ERROR_CODE_REQUIRED_COLUMN_NOT_FOUND_IN_MAPPING
        - COLUMN_ERROR_CODE_REQUIRED_FOREIGN_KEY_NOT_FOUND_IN_MAPPING
        - COLUMN_ERROR_CODE_UNSUPPORTED_CIRCULAR_DEPENDENCY_AT_LEAST_ONE_NULLABLE
        - COLUMN_ERROR_CODE_VFK_SOURCE_COLUMN_NOT_FOUND_IN_MAPPING
        - COLUMN_ERROR_CODE_VFK_SOURCE_COLUMN_NOT_FOUND_IN_SOURCE
        - COLUMN_ERROR_CODE_VFK_TARGET_COLUMN_NOT_FOUND_IN_MAPPING
        - COLUMN_ERROR_CODE_VFK_TARGET_COLUMN_NOT_FOUND_IN_SOURCE
        - COLUMN_ERROR_CODE_VFK_COLUMN_DATATYPE_MISMATCH
        - COLUMN_ERROR_CODE_VFK_SOURCE_COLUMN_NOT_UNIQUE
      description: An enumeration of column error codes
    mgmt.v1alpha1.ColumnError.ColumnErrorReport:
      type: object
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.ColumnError.ColumnErrorCode'
          title: code
          description: The error code
        message:
          type: string
          title: message
          description: The error message
      title: ColumnErrorReport
      additionalProperties: false
      description: Column error report
    mgmt.v1alpha1.ColumnReview:
      type: object
      properties:
        tableSchema:
          type: string
          title: table_schema
          description: The schema of the table
        tableName:
          type: string
          title: table_name
          description: The table the column belongs to
        columnName:
          type: string
          title: column_name
          description: The reviewed column
        reviewedDataType:
          type: string
          title: reviewed_data_type
          description: |-
            The column's type when it was reviewed. A decision is about a column as it stood, so a
             column whose type has moved since is reported again.
        reviewedPiiCategory:
          type: string
          title: reviewed_pii_category
          description: |-
            The detected personal-data category when it was reviewed, empty when nothing was detected.
             It is compared the same way: a column that has since started to read as personal data was
             not the column the reviewer accepted.
        note:
          type:
            - string
            - "null"
          title: note
          description: Why the passthrough is acceptable. This is what an audit asks for.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: When the decision was last made
        updatedByUserId:
          type: string
          title: updated_by_user_id
          description: Who last made it
      title: ColumnReview
      additionalProperties: false
      description: A column left out of a job's mappings whose passthrough someone has reviewed and accepted.
    mgmt.v1alpha1.ColumnWarning:
      type: object
      properties:
        schema:
          type: string
          title: schema
          description: The schema of the table
        table:
          type: string
          title: table
          description: The table of the column
        column:
          type: string
          title: column
          description: The column of the warning
        warningReports:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.ColumnWarning.ColumnWarningReport'
          title: warning_reports
          description: The list of warning reports
      title: ColumnWarning
      additionalProperties: false
    mgmt.v1alpha1.ColumnWarning.ColumnWarningCode:
      type: string
      title: ColumnWarningCode
      enum:
        - COLUMN_WARNING_CODE_UNSPECIFIED
        - COLUMN_WARNING_CODE_NOT_FOUND_IN_SOURCE
        - COLUMN_WARNING_CODE_NOT_FOUND_IN_MAPPING
        - COLUMN_WARNING_CODE_PASSTHROUGH_PENDING_REVIEW
        - COLUMN_WARNING_CODE_SENSITIVE_COLUMN_PASSED_THROUGH
        - COLUMN_WARNING_CODE_REVIEWED_COLUMN_CHANGED
      description: An enumeration of column warning codes
    mgmt.v1alpha1.ColumnWarning.ColumnWarningReport:
      type: object
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.ColumnWarning.ColumnWarningCode'
          title: code
          description: The warning code
        message:
          type: string
          title: message
          description: The warning message
      title: ColumnWarningReport
      additionalProperties: false
      description: Column warning report
    mgmt.v1alpha1.ConsistencyScope:
      type: string
      title: ConsistencyScope
      enum:
        - CONSISTENCY_SCOPE_UNSPECIFIED
        - CONSISTENCY_SCOPE_RUN
        - CONSISTENCY_SCOPE_JOB
        - CONSISTENCY_SCOPE_ACCOUNT
      description: |-
        Reach of deterministic consistency: the same input value produces the same output
         value everywhere inside the scope, and unrelated outputs outside of it.
    mgmt.v1alpha1.CreateJobDestination:
      type: object
      properties:
        connectionId:
          type: string
          title: connection_id
          format: uuid
          description: The connection id to use for the job destination
        options:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.JobDestinationOptions'
          title: options
          description: The destination options to use for the job destination
      title: CreateJobDestination
      additionalProperties: false
    mgmt.v1alpha1.CreateJobDestinationConnectionsRequest:
      type: object
      properties:
        jobId:
          type: string
          title: job_id
          format: uuid
          description: The unique identifier of the job
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.CreateJobDestination'
          title: destinations
          minItems: 1
          description: The list of destinations to create and associate with the job
      title: CreateJobDestinationConnectionsRequest
      additionalProperties: false
    mgmt.v1alpha1.CreateJobDestinationConnectionsResponse:
      type: object
      properties:
        job:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.Job'
          title: job
          description: The job that was updated
      title: CreateJobDestinationConnectionsResponse
      additionalProperties: false
    mgmt.v1alpha1.CreateJobHookRequest:
      type: object
      properties:
        jobId:
          type: string
          title: job_id
          description: The unique identifier of the job
        hook:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.NewJobHook'
          title: hook
          description: The new hook configuration
      title: CreateJobHookRequest
      additionalProperties: false
    mgmt.v1alpha1.CreateJobHookResponse:
      type: object
      properties:
        hook:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.JobHook'
          title: hook
          description: The newly created hook
      title: CreateJobHookResponse
      additionalProperties: false
    mgmt.v1alpha1.CreateJobRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
          format: uuid
          description: The unique account identifier that this job will be associated with
        jobName:
          type: string
          title: job_name
          pattern: ^[a-z0-9-]{3,100}$
          description: The unique, friendly name of the job. This is unique per account
        cronSchedule:
          type:
            - string
            - "null"
          title: cron_schedule
          description: Optionally provide a cron schedule. Goes into effect if the job status is set to enabled
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.JobMapping'
          title: mappings
          description: The list of mappings that will be used to transform the data
        source:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.JobSource'
          title: source
          description: The source connection configuration
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.CreateJobDestination'
          title: destinations
          description: The list of destinations that will be used to store the data
        initiateJobRun:
          type: boolean
          title: initiate_job_run
          description: Initially trigger a run of this job regardless of its status or cron schedule
        workflowOptions:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.WorkflowOptions'
          title: workflow_options
          description: Specify timeouts and other workflow options for the underlying temporal workflow
        syncOptions:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.ActivityOptions'
          title: sync_options
          description: |-
            Specify timeout and retry options for data synchronization activities
             Data sync activities are any piece of work that involves actually synchronizing data from a source to a destination
             For the data sync and generate jobs, this will be applied per table
        virtualForeignKeys:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.VirtualForeignConstraint'
          title: virtual_foreign_keys
          description: The list of virtual foreign keys that will be used to further constrain the data ontop of the database defined constraints
        jobType:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.JobTypeConfig'
            - type: "null"
          title: job_type
          description: The type of job to create
      title: CreateJobRequest
      additionalProperties: false
      description: |
        destinations_required_for_sync // For sync jobs, at least one destination is required
        mappings_required_for_sync // For sync jobs, at least one mapping is required
    mgmt.v1alpha1.CreateJobResponse:
      type: object
      properties:
        job:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.Job'
          title: job
          description: The job that was created
      title: CreateJobResponse
      additionalProperties: false
    mgmt.v1alpha1.CreateJobRunRequest:
      type: object
      properties:
        jobId:
          type: string
          title: job_id
          format: uuid
          description: The unique identifier of the job
      title: CreateJobRunRequest
      additionalProperties: false
    mgmt.v1alpha1.CreateJobRunResponse:
      type: object
      title: CreateJobRunResponse
      additionalProperties: false
    mgmt.v1alpha1.DatabaseColumn:
      type: object
      properties:
        schema:
          type: string
          title: schema
          description: 'The database schema. Ex: public'
        table:
          type: string
          title: table
          description: The name of the table in the schema
        column:
          type: string
          title: column
          description: The name of the column
        dataType:
          type: string
          title: data_type
          description: The datatype of the column
        isNullable:
          type: string
          title: is_nullable
          description: The isNullable Flag of the column
        columnDefault:
          type:
            - string
            - "null"
          title: column_default
          description: The default value of the column if available
        generatedType:
          type:
            - string
            - "null"
          title: generated_type
          description: |-
            Populated if the column is generated. The value is the type of generated column it is. For example, postgres is 's' for stored
             May be other values in the future, or other DB providers may use a different value types.
        identityGeneration:
          type:
            - string
            - "null"
          title: identity_generation
          description: Populated if the column is an identity. The value is the type of the identity column it is. For example, postgres is 'd' for generated by default, or 'a' for generated always.
        characterMaximumLength:
          type:
            - integer
            - "null"
          title: character_maximum_length
          format: int32
          description: |-
            How many characters the column accepts, when its type bounds them. Absent for types that
             bound nothing. It cannot be read back from data_type: MySQL reports `varchar` there and
             keeps the length in column_type, so anything parsing data_type finds no bound on MySQL.
        dataCategory:
          type: string
          title: data_category
          description: 'Nature sémantique détectée pour cette colonne (heuristique nom+type SQL). Ex: "email", "phone_number", "person_full_name". Vide si rien de détecté.'
        isSensitive:
          type: boolean
          title: is_sensitive
          description: True si la colonne est considérée comme une donnée à caractère personnel (RGPD).
        suggestedTransformerSource:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerSource'
          title: suggested_transformer_source
          description: Transformer recommandé pour anonymiser cette colonne. TRANSFORMER_SOURCE_UNSPECIFIED si aucune suggestion.
        piiConfidence:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiConfidence'
          title: pii_confidence
          description: |-
            Niveau de confiance de la détection. Seul CONFIRMED autorise l'application
             automatique du transformer suggéré.
        piiDetectionMethod:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiDetectionMethod'
          title: pii_detection_method
          description: Comment la détection a été obtenue.
        piiEvidence:
          type: string
          title: pii_evidence
          description: |-
            Détail lisible de la preuve, pour l'infobulle. Ex: "clé NIR valide sur 18/18 valeurs",
             "format jj/mm/aaaa prouvé (14 valeurs avec jour > 12)", "format ambigu : jj/mm ou mm/jj".
      title: DatabaseColumn
      additionalProperties: false
    mgmt.v1alpha1.DatabaseError:
      type: object
      properties:
        errorReports:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.DatabaseError.DatabaseErrorReport'
          title: error_reports
          description: The list of error reports
      title: DatabaseError
      additionalProperties: false
    mgmt.v1alpha1.DatabaseError.DatabaseErrorCode:
      type: string
      title: DatabaseErrorCode
      enum:
        - DATABASE_ERROR_CODE_UNSPECIFIED
        - DATABASE_ERROR_CODE_UNSUPPORTED_CIRCULAR_DEPENDENCY_AT_LEAST_ONE_NULLABLE
        - DATABASE_ERROR_CODE_VFK_COLUMN_MISMATCH
      description: An enumeration of database error codes
    mgmt.v1alpha1.DatabaseError.DatabaseErrorReport:
      type: object
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.DatabaseError.DatabaseErrorCode'
          title: code
          description: The error code
        message:
          type: string
          title: message
          description: The error message
      title: DatabaseErrorReport
      additionalProperties: false
      description: Database error report
    mgmt.v1alpha1.DeleteJobDestinationConnectionRequest:
      type: object
      properties:
        destinationId:
          type: string
          title: destination_id
          format: uuid
          description: The unique identifier of the destination to delete
      title: DeleteJobDestinationConnectionRequest
      additionalProperties: false
    mgmt.v1alpha1.DeleteJobDestinationConnectionResponse:
      type: object
      title: DeleteJobDestinationConnectionResponse
      additionalProperties: false
    mgmt.v1alpha1.DeleteJobHookRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: The unique identifier of the hook
      title: DeleteJobHookRequest
      additionalProperties: false
    mgmt.v1alpha1.DeleteJobHookResponse:
      type: object
      title: DeleteJobHookResponse
      additionalProperties: false
    mgmt.v1alpha1.DeleteJobRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: The unique identifier of the job to delete
