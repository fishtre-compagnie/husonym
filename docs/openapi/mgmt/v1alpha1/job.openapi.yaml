security:
  - BearerAuth: []
paths:
  /mgmt.v1alpha1.JobService/CancelJobRun:
    post:
      tags:
        - mgmt.v1alpha1.JobService
      summary: CancelJobRun
      description: Cancels a job run. This is a graceful termination and allows the workflow to clean up and exit gracefully.
      operationId: mgmt.v1alpha1.JobService.CancelJobRun
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
