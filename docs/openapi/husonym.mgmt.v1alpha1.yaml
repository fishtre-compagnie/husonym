      type: object
      title: AutoMap
      additionalProperties: false
      description: Configuration for the AutoMap strategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.HaltJob:
      type: object
      title: HaltJob
      additionalProperties: false
      description: Configuration for the HaltJob strategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.Passthrough:
      type: object
      title: Passthrough
      additionalProperties: false
      description: Configuration for the Passthrough strategy
    mgmt.v1alpha1.PostgresSourceConnectionOptions.NewColumnAdditionStrategy.PassthroughPendingReview:
      type: object
      title: PassthroughPendingReview
      additionalProperties: false
      description: Configuration for the PassthroughPendingReview strategy
