          description: >-
            The transformer to use. If not provided, a transformer will
            automatically be selected (if supported), otherwise it falls back to
            generating a random hash.
      title: Transform
      additionalProperties: false
    mgmt.v1alpha1.PiiDenyRecognizer:
      type: object
      properties:
        name:
          type: string
          title: name
          pattern: ^[a-z0-9-_]{1,100}$
          description: Friendly name of this entity
        denyWords:
          type: array
          items:
            type: string
            minLength: 1
          title: deny_words
          description: List of words that will be treated as PII.
      title: PiiDenyRecognizer
      additionalProperties: false
    mgmt.v1alpha1.TransformCharacterScramble:
      type: object
      properties:
        userProvidedRegex:
          type:
            - string
            - 'null'
          title: user_provided_regex
          description: >-
            A user provided regular expression that will be used to scramble the
            characters in the input string. Must be a valid Golang regex.
      title: TransformCharacterScramble
      additionalProperties: false
    mgmt.v1alpha1.TransformE164PhoneNumber:
      type: object
      properties:
        preserveLength:
          type:
            - boolean
            - 'null'
          title: preserve_length
          description: >-
            Whether or not to preserve the original length of the phone number.
            This causes the transformed phone number to retain the original
            length.
      title: TransformE164PhoneNumber
      additionalProperties: false
    mgmt.v1alpha1.TransformEmail:
      type: object
      properties:
        preserveDomain:
          type:
            - boolean
            - 'null'
          title: preserve_domain
          description: >-
            Whether or not to preserve the original domain, barring what has
            been specified in the excluded_domains property.
        preserveLength:
          type:
            - boolean
            - 'null'
          title: preserve_length
          description: >-
            Whether or not to preserve the original length of the email. This
            causes the transformed email to retain the original length.
        excludedDomains:
          type: array
          items:
            type: string
          title: excluded_domains
          description: >-
            A lsit of email domains that should be excluded. This changes based
            on the preserve_domain flag. See the docs for more details.
        emailType:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.GenerateEmailType'
            - type: 'null'
          title: email_type
          description: >-
            Optionally specify the type of email to generate. The types
            specified determine the contents on the left side of the @.
        invalidEmailAction:
          oneOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.InvalidEmailAction'
            - type: 'null'
          title: invalid_email_action
          description: >-
            Optionally specify an action in the result of an invalid email. An
            invalid email is one that does not conform to RFC 5322.
      title: TransformEmail
      additionalProperties: false
    mgmt.v1alpha1.TransformFirstName:
