components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: >-
            The status code, which should be an enum value of
            [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: >-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            [google.rpc.Status.details][google.rpc.Status.details] field, or
            localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: >-
            A list of messages that carry the error details. There is no limit
            on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: >-
        Error type returned by Connect:
        https://connectrpc.com/docs/go/errors/#http-representation
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: >-
            A URL that acts as a globally unique identifier for the type of the
            serialized message. For example:
            `type.googleapis.com/google.rpc.ErrorInfo`.
        value:
          type: string
          format: binary
          description: >-
            The Protobuf message, serialized as bytes and base64-encoded. The
            specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: >-
            Deserialized error detail payload. The 'type' field indicates the
            schema. This field is for easier debugging and should not be relied
            upon for application logic.
      additionalProperties: true
      description: >-
        Contains an arbitrary serialized message along with a @type that
        describes the type of the serialized message, with an additional debug
        field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - '2023-01-15T01:30:15.01Z'
        - '2024-12-25T12:00:00Z'
      format: date-time
      description: >-
        A point in time in RFC 3339 format, with up to nanosecond precision.
        Output uses UTC (`Z`); input may use an offset from UTC.
    mgmt.v1alpha1.AccountHook:
      type: object
      properties:
        id:
          type: string
          title: id
          description: The unique identifier of this hook.
        name:
          type: string
          title: name
          description: Name of the hook for display/reference.
        description:
          type: string
          title: description
          description: Description of what this hook does.
        accountId:
          type: string
          title: account_id
          description: The unique identifier of the account this hook belongs to.
        events:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.AccountHookEvent'
          title: events
          description: The events that will trigger this hook.
        config:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.AccountHookConfig'
          title: config
          description: Hook-type specific configuration.
        createdByUserId:
          type: string
          title: created_by_user_id
          description: The user that created this hook.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: The time this hook was created.
        updatedByUserId:
          type: string
          title: updated_by_user_id
          description: The user that last updated this hook.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: The last time this hook was updated.
        enabled:
          type: boolean
          title: enabled
          description: Whether or not the hook is enabled.
      title: AccountHook
      additionalProperties: false
    mgmt.v1alpha1.AccountHookConfig:
      type: object
      allOf:
        - oneOf:
            - required:
                - webhook
            - required:
                - slack
      anyOf:
        - type: object
          properties:
            slack:
              allOf:
                - $ref: >-
                    #/components/schemas/mgmt.v1alpha1.AccountHookConfig.SlackHook
              title: slack
              description: 'Slack-based hooks Future: Discord, Teams, etc.'
          title: slack
        - type: object
          properties:
            webhook:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.AccountHookConfig.WebHook'
              title: webhook
              description: Webhook-based hooks
          title: webhook
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - slack
              - required:
                  - webhook
          - not:
              oneOf:
                - required:
                    - slack
                - required:
                    - webhook
      title: AccountHookConfig
      description: Hook-specific configuration
    mgmt.v1alpha1.AccountHookConfig.SlackHook:
      type: object
      properties:
        channelId:
          type: string
          title: channel_id
          minLength: 1
          description: The Slack channel id to post messages to.
      title: SlackHook
      additionalProperties: false
      description: Slack hook configuration
    mgmt.v1alpha1.AccountHookConfig.WebHook:
      type: object
      properties:
        url:
          type: string
          title: url
          format: uri
          description: The webhook URL to send the event to.
        secret:
          type: string
          title: secret
          minLength: 1
          description: The secret to use for the webhook.
        disableSslVerification:
          type: boolean
          title: disable_ssl_verification
          description: Whether to disable SSL verification for the webhook.
      title: WebHook
      additionalProperties: false
      description: Webhook-specific configuration
    mgmt.v1alpha1.AccountHookEvent:
      type: string
      title: AccountHookEvent
      enum:
        - ACCOUNT_HOOK_EVENT_UNSPECIFIED
        - ACCOUNT_HOOK_EVENT_JOB_RUN_CREATED
        - ACCOUNT_HOOK_EVENT_JOB_RUN_FAILED
        - ACCOUNT_HOOK_EVENT_JOB_RUN_SUCCEEDED
      description: Enum of all possible events that can trigger an account hook.
    mgmt.v1alpha1.CreateAccountHookRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
          format: uuid
          description: The account ID to create the hook for.
        hook:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.NewAccountHook'
          title: hook
          description: The new account hook configuration.
      title: CreateAccountHookRequest
      required:
        - hook
      additionalProperties: false
    mgmt.v1alpha1.CreateAccountHookResponse:
      type: object
      properties:
        hook:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.AccountHook'
          title: hook
          description: The newly created account hook.
      title: CreateAccountHookResponse
