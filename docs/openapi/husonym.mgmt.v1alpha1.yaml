            unmapped column for the job's mapped tables.
        columnRemovalStrategy:
          allOf:
            - $ref: >-
                #/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy
          title: column_removal_strategy
          description: >-
