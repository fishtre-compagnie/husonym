    mgmt.v1alpha1.PostgresOnConflictConfig.PostgresOnConflictUpdate:
      type: object
      title: PostgresOnConflictUpdate
      additionalProperties: false
      description: |-
        Update strategy // List of table-specific update configurations
         repeated PostgresOnConflictSchemaUpdate schemas = 1;
