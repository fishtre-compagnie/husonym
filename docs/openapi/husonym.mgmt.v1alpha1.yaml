          description: The account the rules are tried for.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/mgmt.v1alpha1.JavascriptRule'
          title: rules
          maxItems: 50
          minItems: 1
          description: >-
            The JavaScript rules of one table, in the order the job maps them:
            they run together
             on each row, and share their state for the row, the way a job runs them.
        rows:
          type: array
          items:
            type: string
          title: rows
          maxItems: 20
          minItems: 1
          description: >-
            The rows to try the rules on, each a JSON object from column name to
            value. They are
             the rows the user types, never rows read from a source.
