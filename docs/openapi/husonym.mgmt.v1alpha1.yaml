      type: object
      anyOf:
        - type: object
          properties:
            continueJob:
              allOf:
                - $ref: >-
                    #/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy.ContinueJob
              title: continue_job
              description: continue job if a column is removed
          title: continue_job
        - type: object
          properties:
            haltJob:
              allOf:
                - $ref: >-
                    #/components/schemas/mgmt.v1alpha1.PostgresSourceConnectionOptions.ColumnRemovalStrategy.HaltJob
              title: halt_job
              description: halt job if a column is removed
          title: halt_job
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - continueJob
              - required:
                  - haltJob
          - not:
              oneOf:
                - required:
                    - continueJob
                - required:
                    - haltJob
      title: ColumnRemovalStrategy
