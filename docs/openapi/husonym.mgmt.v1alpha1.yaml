    mgmt.v1alpha1.DatabaseColumn:
      type: object
      properties:
        schema:
          type: string
          title: schema
          description: 'The database schema. Ex: public'
        table:
          type: string
          title: table
          description: The name of the table in the schema
        column:
          type: string
          title: column
          description: The name of the column
        dataType:
          type: string
          title: data_type
          description: The datatype of the column
        isNullable:
          type: string
          title: is_nullable
          description: The isNullable Flag of the column
        columnDefault:
          type:
            - string
            - 'null'
          title: column_default
          description: The default value of the column if available
        generatedType:
          type:
            - string
            - 'null'
          title: generated_type
          description: >-
            Populated if the column is generated. The value is the type of
            generated column it is. For example, postgres is 's' for stored
             May be other values in the future, or other DB providers may use a different value types.
        identityGeneration:
          type:
            - string
            - 'null'
          title: identity_generation
          description: >-
            Populated if the column is an identity. The value is the type of the
            identity column it is. For example, postgres is 'd' for generated by
            default, or 'a' for generated always.
        characterMaximumLength:
          type:
            - integer
            - 'null'
          title: character_maximum_length
          format: int32
          description: >-
            How many characters the column accepts, when its type bounds them.
            Absent for types that
             bound nothing. It cannot be read back from data_type: MySQL reports `varchar` there and
             keeps the length in column_type, so anything parsing data_type finds no bound on MySQL.
        dataCategory:
          type: string
          title: data_category
          description: >-
            Nature sémantique détectée pour cette colonne (heuristique nom+type
            SQL). Ex: "email", "phone_number", "person_full_name". Vide si rien
            de détecté.
        isSensitive:
          type: boolean
          title: is_sensitive
          description: >-
            True si la colonne est considérée comme une donnée à caractère
            personnel (RGPD).
        suggestedTransformerSource:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.TransformerSource'
          title: suggested_transformer_source
          description: >-
            Transformer recommandé pour anonymiser cette colonne.
            TRANSFORMER_SOURCE_UNSPECIFIED si aucune suggestion.
        piiConfidence:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiConfidence'
          title: pii_confidence
          description: >-
            Niveau de confiance de la détection. Seul CONFIRMED autorise
            l'application
             automatique du transformer suggéré.
        piiDetectionMethod:
          allOf:
            - $ref: '#/components/schemas/mgmt.v1alpha1.PiiDetectionMethod'
          title: pii_detection_method
          description: Comment la détection a été obtenue.
        piiEvidence:
          type: string
          title: pii_evidence
          description: >-
            Détail lisible de la preuve, pour l'infobulle. Ex: "clé NIR valide
            sur 18/18 valeurs",
             "format jj/mm/aaaa prouvé (14 valeurs avec jour > 12)", "format ambigu : jj/mm ou mm/jj".
      title: DatabaseColumn
      additionalProperties: false
    mgmt.v1alpha1.DatabaseTable:
