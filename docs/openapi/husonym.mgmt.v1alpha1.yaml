              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Mask'
              title: mask
              description: Configures the anonymizer to mask the identified PII
          title: mask
        - type: object
          properties:
            redact:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Redact'
              title: redact
              description: >-
                Configures the anonymizer to completely remove the identified
                PII
          title: redact
        - type: object
          properties:
            replace:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Replace'
              title: replace
              description: >-
                Configures the anonymizer to replace the identified PII with a
                specific value
          title: replace
        - type: object
          properties:
            transform:
              allOf:
                - $ref: '#/components/schemas/mgmt.v1alpha1.PiiAnonymizer.Transform'
              title: transform
              description: >-
                Configures the anonymizer to use a Husonym configured
                transformer
          title: transform
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - hash
              - required:
                  - mask
              - required:
                  - redact
              - required:
                  - replace
              - required:
                  - transform
          - not:
              oneOf:
                - required:
                    - hash
                - required:
                    - mask
                - required:
                    - redact
                - required:
                    - replace
                - required:
                    - transform
