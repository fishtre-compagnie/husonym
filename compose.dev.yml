name: husonym

include:
  - path: ./compose/temporal/compose.yml
    env_file:
      - ./compose/temporal/.env
  - path: ./compose/compose-db.yml
  # - path: ./compose/compose-db-mysql.yml
  # - path: ./compose/compose-db-mongo.yml
  # - path: ./compose/compose-db-dynamo.yml
  # - path: ./compose/compose-db-mssql.yml

services:
  app:
    container_name: husonym-app
    build:
      context: ./
      dockerfile: ./frontend/apps/web/dev/build/Dockerfile.dev
    ports:
      - 3000:3000
    environment:
      - HOSTNAME=0.0.0.0
      - HUSONYM_ENV=dev
      - NEXTAUTH_SECRET=foo
      - NEXTAUTH_URL=http://localhost:3000
      - HUSONYM_API_BASE_URL=http://api:8080
      - NEXT_PUBLIC_APP_BASE_URL=http://localhost:3000


      - AUTH_ENABLED=false

    env_file:
      - path: ./.env.app.local
        required: false
    networks:
      - husonym-network
    volumes:
      - ./frontend:/app/:rw
      - husonym_app_nodemodules:/app/node_modules
      - husonym_web_nodemodules:/app/apps/web/node_modules
      - husonym_sdk_nodemodules:/app/packages/sdk/node_modules
      - husonym_next_cache:/app/apps/web/.next

  db:
    container_name: husonym-db
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=husonym
      - POSTGRES_PASSWORD=foofar
      - PGUSER=postgres
    healthcheck:
      test: ['CMD', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - husonym-network
    volumes:
      - husonym_pg_data:/var/lib/postgresql/data
      - ./scripts/pg-init:/docker-entrypoint-initdb.d

  api:
    container_name: husonym-api
    build:
      context: ./
      dockerfile: ./backend/dev/build/Dockerfile.dev
    # air runs as PID 1 and reaps none of the processes it starts: every rebuild left a
    # defunct dlv, tens of thousands in a night, until the host could fork no more.
    init: true
    ports:
      - 8080:8080
      - 2345:2345 # DLV API
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - HUSONYM_ENV=dev
      - APP_BASEURL=http://localhost:3000
      - TEMPORAL_URL=temporal:7233
      - DB_AUTO_MIGRATE=true
      - DB_SCHEMA_DIR=/workspace/backend/sql/postgresql/schema
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=husonym
      - DB_USER=postgres
      - DB_PASS=foofar
      - DB_SSL_DISABLE=true
      - DB_MIGRATIONS_TABLE=husonym_api_schema_migrations
      - DB_MIGRATIONS_TABLE_QUOTED=false
      - LOG_LEVEL=DEBUG

      - DB_LOG_LEVEL=ERROR

      - AUTH_ENABLED=false

      - HUSONYM_INSTALL_KIND=compose
      # - HUSONYM_TELEMETRY=offline # what the instance does with its usage report: offline or off (not set: what the license provides)

      # Mot de passe de chiffrement des secrets d'un réglage de compte. De
      # développement uniquement : en production, fournir un secret propre.
      - HUSONYM_SYM_ENCRYPTION_PASSWORD=husonym-dev-only-encryption-password

      # Scan de contenu PII (Phase 2) : client Presidio maison, hors licence EE.
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      # « fr » : le modèle des personnes de l'image n'est interrogé que dans cette
      # langue (docker/presidio-fr/README.md). Dans le pipeline, ce qui compte
      # aussi est que Presidio DÉTECTE : sur une colonne d'adresses il émet
      # LOCATION en français et rien en anglais, et l'affinage Go (refine.go)
      # reclasse ensuite ce LOCATION en adresse. Un signal mal étiqueté qu'un
      # étage aval sait corriger vaut mieux qu'aucun signal.
      - PRESIDIO_DEFAULT_LANGUAGE=fr

    env_file:
      - path: ./.env.api.local
        required: false
    networks:
      - husonym-network
      - temporal-network
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - ./backend:/workspace/backend:rw
      - ./worker:/workspace/worker:rw
      - ./internal:/workspace/internal:rw
      - ./go.mod:/workspace/go.mod:rw
      - ./go.sum:/workspace/go.sum:rw
      - husonym_api_tmp:/workspace/tmp
      - husonym_go_mod_cache:/go/pkg/mod
      - husonym_backend_build_cache:/root/.cache/go-build
    restart: on-failure

  worker:
    container_name: husonym-worker
    build:
      context: ./
      dockerfile: ./worker/dev/build/Dockerfile.dev
    # Same as the api: an init reaps what air leaves behind.
    init: true
    ports:
      - 2346:2345 # DLV Worker
    environment:
      - HUSONYM_ENV=dev
      - TEMPORAL_URL=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=sync-job
      - HUSONYM_URL=http://api:8080
      - REDIS_URL=redis://default:foofar@redis:6379
      - TABLESYNC_MAX_CONCURRENCY=3
      - LOG_LEVEL=DEBUG
      - DB_LOG_LEVEL=ERROR
      # Clé de développement uniquement : en production, fournir un secret propre — ou
      # ne rien poser, et chaque compte reçoit la sienne à son premier run. Posée ici,
      # elle gagne tant qu'aucun compte ne porte de réglage, donc les sorties des bases
      # de développement ne bougent pas.
      - ANONYMIZATION_CONSISTENCY_KEY=husonym-dev-only-consistency-key
    env_file:
      - path: ./.env.worker.local
        required: false
    networks:
      - husonym-network
      - temporal-network
    depends_on:
      temporal:
        condition: service_healthy
        restart: true
      temporal-create-namespace:
        condition: service_completed_successfully
    volumes:
      - ./backend:/workspace/backend:rw
      - ./worker:/workspace/worker:rw
      - ./internal:/workspace/internal:rw
      - ./go.mod:/workspace/go.mod:rw
      - ./go.sum:/workspace/go.sum:rw
      - husonym_worker_tmp:/workspace/tmp
      - husonym_go_mod_cache:/go/pkg/mod
      - husonym_worker_build_cache:/root/.cache/go-build
    restart: on-failure

  redis:
    container_name: husonym-redis
    image: redis:7.2.4
    ports:
      - 6379:6379
    command: redis-server --save 20 1 --loglevel warning --requirepass foofar
    networks:
      - husonym-network
    volumes:
      - husonym_redis_cache:/data

  mysql:
    container_name: husonym-mysql
    image: mysql:8
    ports:
      - 33306:3306
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: octopus
      MYSQL_USER: husonym
      MYSQL_PASSWORD: husonympass
    networks:
      - husonym-network

  # Presidio Analyzer (Microsoft, MIT) francisé pour le scan de contenu PII.
  # L'image officielle ne connaît que l'anglais et n'a aucun reconnaisseur
  # français : les téléphones FR passent inaperçus et un NIR ressort en carte
  # bancaire. Voir docker/presidio-fr/README.md pour les mesures.
  #
  # La configuration (nlp.yaml, recognizers.yaml, analyzer.yaml) est dans
  # l'image et n'est plus montée. `pull_policy: build` fait construire l'image
  # à chaque `docker compose up`, même sans `--build` : les couches inchangées
  # viennent du cache, et une modification de docker/presidio-fr est prise.
  # Sans cela, une image locale construite quand la configuration était encore
  # montée serait relancée telle quelle : elle démarre, répond sur /health, et
  # rend une erreur 500 « No matching recognizers were found » à chaque appel
  # en français.
  presidio-analyzer:
    container_name: husonym-presidio-analyzer
    build:
      context: ./docker/presidio-fr
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - 5002:3000
    networks:
      - husonym-network

volumes:
  husonym_redis_cache:
  husonym_mysqlZ:
  husonym_pg_data:
  husonym_api_tmp:
  husonym_backend_build_cache:
  husonym_worker_tmp:
  husonym_worker_build_cache:
  husonym_go_mod_cache:
  husonym_app_nodemodules:
  husonym_web_nodemodules:
  husonym_sdk_nodemodules:
  husonym_next_cache:

networks:
  husonym-network:
    name: husonym-network
