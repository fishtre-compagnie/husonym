version: 2
updates:
  # Enable version updates for go
  - package-ecosystem: "gomod"
    schedule:
      interval: "daily"
    labels:
      - dependencies
    directory: "/"
    groups:
      golang-minor:
        update-types:
          - minor
          - patch
    # client-go requires the api and apimachinery of its own release: raised on their own,
    # ahead of it, they break its build. They follow client-go instead.
    ignore:
      - dependency-name: "k8s.io/api"
      - dependency-name: "k8s.io/apimachinery"
  - package-ecosystem: "gomod"
    schedule:
      interval: "daily"
    labels:
      - dependencies
    directory: "tools"
    groups:
      golang-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: "npm"
    directory: "frontend"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
    versioning-strategy: increase

  - package-ecosystem: "npm"
    directory: "docs"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    groups:
      npm-all-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
