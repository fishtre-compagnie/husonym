name: Control Plane Image

on:
  push:
    branches:
      - main
    paths:
      - controlplane/**
      - internal/license/**
      - internal/telemetry/**
      - backend/gen/go/protos/mgmt/v1alpha1/**
      - go.mod
      - go.sum
      - docker/Dockerfile.controlplane
      - .github/workflows/controlplane-image.yml
  pull_request:
    paths:
      - controlplane/**
      - internal/license/**
      - internal/telemetry/**
      - backend/gen/go/protos/mgmt/v1alpha1/**
      - go.mod
      - go.sum
      - docker/Dockerfile.controlplane
      - .github/workflows/controlplane-image.yml
  workflow_dispatch:

# Only main publishes: a pull request and a manual run from another branch build without pushing.
#
# One run at a time per ref. On main, runs wait for one another, so that its tag ends on the
# latest commit; on a pull request, a newer run replaces the older.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-controlplane:
    name: Control Plane Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}/controlplane
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.controlplane
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
