              has_deps=$(yq -r '.dependencies[0].version' "$filepath")
              if [ $has_deps != null ]; then
                yq -i '.dependencies[].version = strenv(CHART_VERSION)' "$filepath"
                yq -i '.dependencies[].repository = "oci://ghcr.io/"+(strenv(GITHUB_REPOSITORY)|downcase)+"/helm"' "$filepath"
              fi
            done

      - name: Install Helm
        uses: azure/setup-helm@v5
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Login to Helm Registry
        run: |
          echo ${{secrets.GITHUB_TOKEN}} | helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Package Helm Charts
        shell: bash
        run: |
          # Finds all root charts and packages up their dependencies
          find charts/*/Chart.yaml -type f -name 'Chart.yaml' | sed -r 's|/[^/]+$||' | sort | uniq | xargs -L 1 helm dep up

          # Runs through root charts and packages them
          for filedir in charts/*/ ; do
            echo "$filedir"
            helm package "$filedir"
          done

      - name: Helm | Publish
        shell: bash
        run: |
          OCI_URL="oci://ghcr.io/${GITHUB_REPOSITORY,,}/helm"
          for d in ./*.tgz ; do
              helm push "$d" "$OCI_URL"
          done

  cli:
    name: CLI
    runs-on: ubuntu-latest
    #  for now, only build when we cut a new tag
    if: startsWith(github.ref, 'refs/tags/')
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # needs to be a non-action token if also pushes to the homebrew repo
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          DISABLE_CHANGELOG: false
          HUSONYM_BASE_URL: http://localhost:8080

  py-sdk-build:
    name: Python SDK Build
    runs-on: ubuntu-latest
    # Désactivé pour le fork : la publication PyPI (py-sdk-publish) cible le
    # package "husonym" que le fork ne possède pas, et requiert un trusted publisher.
    # Réactiver avec : if: startsWith(github.ref, 'refs/tags/')
    if: false
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Package Version
        id: package_version
        run: |
          V_PREFIX="v"
          VERSION="${{ github.ref_name }}"
          TRIMMED_VERSION="${VERSION/#$V_PREFIX}"
          echo "$TRIMMED_VERSION"
          echo "PACKAGE_VERSION=$TRIMMED_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build SDK
        run: |
          python -m pip install build
          python -m build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.package_version.outputs.PACKAGE_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: py-package
          path: python/dist/

  py-sdk-publish:
    name: Python SDK Publish
    runs-on: ubuntu-latest
    # Désactivé pour le fork, comme py-sdk-build : le package PyPI "husonym"
    # n'est pas le nôtre. Le `if` est répété ici pour que réactiver le build
    # ne déclenche pas une publication par accident.
    if: false
    needs:
      - py-sdk-build
    permissions:
      id-token: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: py-package
          path: python/dist/
      - name: Publish release distributions to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          attestations: true

