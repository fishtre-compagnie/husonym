name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**

# One deployment at a time, cancelling any in-progress run
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./docs/package-lock.json

      - run: npm ci
      - run: npm run build

      # Serves build/ from Workers Static Assets on docs.husonym.com.
      # See docs/wrangler.jsonc for the routing configuration.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
