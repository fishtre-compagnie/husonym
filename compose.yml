name: husonym

include:
  - path: ./compose/temporal/compose.yml
    env_file:
      - ./compose/temporal/.env
  - path: ./compose/compose-db.yml
  # - path: ./compose/compose-db-mysql.yml
  # - path: ./compose/compose-db-mongo.yml
  # - path: ./compose/compose-db-dynamo.yml
  # - path: ./compose/compose-db-mssql.yml

services:
  app:
    container_name: husonym-app
    image: ghcr.io/fishtre-compagnie/husonym/app:latest
    ports:
      - 3000:3000
    environment:
      - HOSTNAME=0.0.0.0
      - NUCLEUS_ENV=dev
      - NEXTAUTH_SECRET=foo
      - NEXTAUTH_URL=http://localhost:3000
      - HUSONYM_API_BASE_URL=http://api:8080
      - NEXT_PUBLIC_APP_BASE_URL=http://localhost:3000

      - POSTHOG_KEY=phc_qju45RhNvCDwYVdRyUjtWuWsOmLFaQZi3fmztMBaJip

      - AUTH_ENABLED=false

    networks:
      - husonym-network

  db:
    container_name: husonym-db
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=nucleus
      - POSTGRES_PASSWORD=foofar
      - PGUSER=postgres
    healthcheck:
      test: ['CMD', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - husonym-network
    volumes:
      - husonym_pg_data:/var/lib/postgresql/data
      - ./scripts/pg-init:/docker-entrypoint-initdb.d

  api:
    container_name: husonym-api
    image: ghcr.io/fishtre-compagnie/husonym/api:latest
    ports:
      - 8080:8080
    command: serve connect
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - NUCLEUS_ENV=dev
      - APP_BASEURL=http://localhost:3000
      - TEMPORAL_URL=temporal:7233
      - DB_AUTO_MIGRATE=true
      - DB_SCHEMA_DIR=/migrations
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nucleus
      - DB_USER=postgres
      - DB_PASS=foofar
      - DB_SSL_DISABLE=true
      - DB_MIGRATIONS_TABLE=husonym_api_schema_migrations
      - DB_MIGRATIONS_TABLE_QUOTED=false

      - AUTH_ENABLED=false

    networks:
      - husonym-network
      - temporal-network
    restart: on-failure

    depends_on:
      db:
        condition: service_healthy
        restart: true

  api-seed:
    container_name: husonym-api-seed
    image: postgres:15
    entrypoint: >
      /bin/sh -c "./scripts/wait-for-it.sh api:8080 -- psql 'postgresql://postgres:foofar@husonym-db:5432/nucleus?sslmode=disable' -f /scripts/seed.sql"
    volumes:
      - ./scripts/seed-husonym.sql:/scripts/seed.sql
      - ./scripts/wait-for-it.sh:/scripts/wait-for-it.sh
    depends_on:
      - api
    networks:
      - husonym-network

  temporal-seed:
    container_name: husonym-temporal-seed
    image: temporalio/admin-tools:1.26.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    entrypoint: /bin/sh -c "/create_schedules.sh"
    volumes:
      - ./scripts/create_schedules.sh:/create_schedules.sh
    depends_on:
      - api
    networks:
      - husonym-network
      - temporal-network

  worker:
    container_name: husonym-worker
    image: ghcr.io/fishtre-compagnie/husonym/worker:latest
    environment:
      - NUCLEUS_ENV=dev
      - TEMPORAL_URL=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=sync-job
      - HUSONYM_URL=http://api:8080
      - REDIS_URL=redis://default:foofar@redis:6379
      - TABLESYNC_MAX_CONCURRENCY=3
    networks:
      - husonym-network
      - temporal-network
    restart: on-failure

  redis:
    container_name: husonym-redis
    image: redis:7.2.4
    ports:
      - 6379:6379
    command: redis-server --save 20 1 --loglevel warning --requirepass foofar
    networks:
      - husonym-network
    volumes:
      - husonym_redis_cache:/data

volumes:
  husonym_redis_cache:
  husonym_pg_data:

networks:
  husonym-network:
    name: husonym-network
