services:
  husonym-llm:
    container_name: husonym-llm
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - 8081:8080
    environment:
      - LLM_MODEL_FILE=${LLM_MODEL_FILE:-model.gguf}
    command: ["-m", "/models/${LLM_MODEL_FILE:-model.gguf}", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - husonym-network
    volumes:
      - ./llm-models:/models
