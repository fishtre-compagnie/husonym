[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "husonym"
dynamic = ["version"]
authors = [
  { name = "Husonym Dev Team", email="infra@husonym.com"}
]
description = "Husonym Python SDK"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
  "grpcio==1.81.*",
  "protobuf==7.*",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
  "Topic :: Utilities",
]
keywords = [
  "husonym",
  "data",
  "privacy",
  "anonymization",
  "data-privacy",
  "data-anonymization",
  "data-protection",
  "data-masking",
  "data-obfuscation",
  "data-scrubbing",
  "data-de-identification",
]

[project.urls]
Homepage = "https://github.com/fishtre-compagnie/husonym"
Issues = "https://github.com/fishtre-compagnie/husonym/issues"
Documentation = "https://docs.husonym.com/api/python"


[tool.hatch.version]
source = "vcs"
