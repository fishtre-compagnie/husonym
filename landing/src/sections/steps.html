<section class="steps" id="comment-ca-marche">
  <div class="container">
    <div class="section-head center reveal">
      <div class="eyebrow center">{{steps.eyebrow}}</div>
      <h2>{{steps.title}}</h2>
    </div>
    <div class="steps-track reveal">
      <div class="step">
        <div class="step-num">1</div>
        <h3>{{steps.step1Title}}</h3>
        <p>{{steps.step1Body}}</p>
        <div class="step-line" aria-hidden="true"><svg viewBox="0 0 100 2" preserveAspectRatio="none"><path d="M0,1 L100,1"/></svg></div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <h3>{{steps.step2Title}}</h3>
        <p>{{steps.step2Body}}</p>
        <div class="step-line" aria-hidden="true"><svg viewBox="0 0 100 2" preserveAspectRatio="none"><path d="M0,1 L100,1"/></svg></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <h3>{{steps.step3Title}}</h3>
        <p>{{steps.step3Body}}</p>
        <div class="step-line" aria-hidden="true"><svg viewBox="0 0 100 2" preserveAspectRatio="none"><path d="M0,1 L100,1"/></svg></div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <h3>{{steps.step4Title}}</h3>
        <p>{{steps.step4Body}}</p>
      </div>
    </div>
  </div>
</section>
