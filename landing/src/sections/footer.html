<footer class="site-footer">
  <div class="container footer-inner">
    <a class="footer-brand" href="#top" aria-label="Husonym">
      <img src="/assets/logo.png" alt="Husonym" width="98" height="21" />
    </a>
    <nav class="footer-links" aria-label="{{footer.ariaLabel}}">
      <a href="#fonctionnalites">{{nav.features}}</a>
      <a href="#comment-ca-marche">{{nav.how}}</a>
      <a href="#connecteurs">{{nav.connectors}}</a>
      <a href="#securite">{{nav.security}}</a>
      <a href="#tarifs">{{nav.pricing}}</a>
      <a href="#contact">{{nav.contact}}</a>
    </nav>
    <!-- The year is an assembly token, not a catalogue string: those are substituted
         first, so a {{__year__}} sitting inside a translation would never resolve. -->
    <div class="footer-meta">&copy; {{__year__}} {{footer.tagline}}</div>
  </div>
</footer>
