<section class="trust" id="securite">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow">{{trust.eyebrow}}</div>
      <h2>{{trust.title}}</h2>
      <p>{{trust.body}}</p>
    </div>
    <div class="trust-grid reveal-stagger reveal">
      <div class="trust-card">
        <h4>{{trust.card1Title}}</h4>
        <p>{{trust.card1Body}}</p>
      </div>
      <div class="trust-card">
        <h4>{{trust.card2Title}}</h4>
        <p>{{trust.card2Body}}</p>
      </div>
      <div class="trust-card">
        <h4>{{trust.card3Title}}</h4>
        <p>{{trust.card3Body}}</p>
      </div>
      <div class="trust-card">
        <h4>{{trust.card4Title}}</h4>
        <p>{{trust.card4Body}}</p>
      </div>
    </div>
    <div class="compliance-chips reveal">
      <span class="chip-lg">GDPR</span>
      <span class="chip-lg">HIPAA</span>
      <span class="chip-lg">FERPA</span>
      <span class="chip-lg">DPDP</span>
    </div>
    <p class="trust-disclaimer">{{trust.disclaimer}}</p>
  </div>
</section>
