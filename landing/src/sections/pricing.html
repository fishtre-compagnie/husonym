<section class="pricing" id="tarifs">
  <div class="container">
    <div class="section-head center reveal">
      <div class="eyebrow center">{{pricing.eyebrow}}</div>
      <h2>{{pricing.title}}</h2>
      <p>{{pricing.body}}</p>
    </div>

    <div class="pricing-solo reveal">
      <div class="price-card is-trial">
        <h3>{{pricing.demo.name}}</h3>
        <p class="price-tagline">{{pricing.demo.tagline}}</p>
        <div class="price-value">
          <span class="price-amount">{{pricing.demo.price}}</span>
        </div>
        <a class="btn btn-primary price-cta" href="#contact">{{pricing.demo.cta}}</a>
        <ul class="price-features">
          <li>{{pricing.demo.feat1}}</li>
          <li>{{pricing.demo.feat2}}</li>
          <li>{{pricing.demo.feat3}}</li>
        </ul>
      </div>
    </div>

    <p class="pricing-footnote">{{pricing.footnote}}</p>
  </div>
</section>
