<section class="sovereignty">
  <div class="container sovereignty-inner reveal">
    <div class="sovereignty-text">
      <div class="eyebrow">{{sovereignty.eyebrow}}</div>
      <h2>{{sovereignty.title}}</h2>
      <p>{{sovereignty.body}}</p>
      <p class="sovereignty-note">{{sovereignty.note}}</p>
    </div>
    <div class="sovereignty-stats">
      <div class="sovereignty-stat"><span class="val">0</span><span class="lbl">{{sovereignty.stat1}}</span></div>
      <div class="sovereignty-stat"><span class="val">100 %</span><span class="lbl">{{sovereignty.stat2}}</span></div>
      <div class="sovereignty-stat"><span class="val">{{sovereignty.stat3Val}}</span><span class="lbl">{{sovereignty.stat3}}</span></div>
    </div>
  </div>
</section>
