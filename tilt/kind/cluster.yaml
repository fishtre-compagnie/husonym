apiVersion: ctlptl.dev/v1alpha1
kind: Registry
name: husonym-dev-registry
---
apiVersion: ctlptl.dev/v1alpha1
kind: Cluster
product: kind
registry: husonym-dev-registry
name: kind-husonym-dev # must have kind- prefix
kindV1Alpha4Cluster:
  nodes:
  - role: control-plane
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "ingress-ready=true"
    extraMounts:
    - hostPath: {HUSONYM_DEV_HOSTPATH}
      containerPath: /husonym
