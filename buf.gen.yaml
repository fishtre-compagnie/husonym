version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/fishtre-compagnie/husonym/backend/gen/go/protos
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: backend/gen/go/protos
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: backend/gen/go/protos
    opt: paths=source_relative

  - remote: buf.build/bufbuild/es:v2.12.0
    out: frontend/packages/sdk/src/client
    opt:
      - target=ts
      - import_extension=.js
    include_imports: true

  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: docs/protos
    opt: json,proto_docs.json

  - local: protoc-gen-connect-openapi
    out: docs/openapi
    opt:
      - content-types=json,base=husonym.openapi.template.yaml

  - remote: buf.build/community/mfridman-go-json:v1.6.0
    out: backend/gen/go/protos
    opt: paths=source_relative

  - remote: buf.build/protocolbuffers/python:v35.1 # generates messages and enums
    out: python/src/husonym
    include_imports: true
  - remote: buf.build/protocolbuffers/pyi:v35.1 # generates type hints
    out: python/src/husonym
  - remote: buf.build/grpc/python:v1.81.1 # generates grpc client
    out: python/src/husonym
