# Catalogue de reconnaisseurs : anglais + francais.
#
# Presidio livre 50 reconnaisseurs pays (US, UK, ES, IT, IN, AU, SG, KR, PL, FI...)
# mais AUCUN pour la France. Les reconnaisseurs francais ci-dessous sont donc des
# ajouts maison (type: custom, a base de regex).
#
# Limite importante : un reconnaisseur "custom" Presidio ne fait que du motif.
# Il ne verifie AUCUNE cle de controle (NIR mod 97, Luhn, IBAN mod 97). Un NIR
# au bon format mais a la cle fausse sera donc accepte ici, alors qu'un
# validateur cote Go le rejetterait. C'est la difference entre "ressemble a"
# et "est un".
supported_languages:
  - en
  - fr

global_regex_flags: 26

recognizers:
  # --- Reconnaisseurs generiques (pas de supported_languages => toutes langues) --
  - name: CreditCardRecognizer
    supported_languages:
      - language: en
        context: [credit, card, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
      - language: fr
        context: [carte, credit, bancaire, visa, mastercard, cb, paiement]
    type: predefined

  - name: EmailRecognizer
    type: predefined

  - name: IbanRecognizer
    type: predefined

  - name: IpRecognizer
    type: predefined

  - name: PhoneRecognizer
    type: predefined

  - name: DateRecognizer
    type: predefined

  - name: UrlRecognizer
    type: predefined

  - name: CryptoRecognizer
    type: predefined

  - name: MacAddressRecognizer
    type: predefined

  # --- Reconnaisseurs francais (absents de Presidio) --------------------------

  # NIR (numero de securite sociale) : 15 chiffres.
  # 1 sexe | 2 annee | 2 mois | 2 dept (2A/2B pour la Corse) | 3 commune | 3 ordre | 2 cle
  - name: FrNirRecognizer
    supported_languages:
      - language: fr
        context: [securite, sociale, nir, insee, secu, vitale, assure]
      - language: en
        context: [social, security, nir, insee]
    type: custom
    supported_entity: FR_NIR
    patterns:
      - name: nir_avec_cle
        regex: '\b[12][\s.-]?\d{2}[\s.-]?(?:0[1-9]|1[0-2])[\s.-]?(?:\d{2}|2[AB])[\s.-]?\d{3}[\s.-]?\d{3}[\s.-]?\d{2}\b'
        score: 0.6
      - name: nir_sans_cle
        regex: '\b[12][\s.-]?\d{2}[\s.-]?(?:0[1-9]|1[0-2])[\s.-]?(?:\d{2}|2[AB])[\s.-]?\d{3}[\s.-]?\d{3}\b'
        score: 0.4

  # Telephone francais : 0X XX XX XX XX, +33X..., 0033X...
  # Le PhoneRecognizer de Presidio s'appuie sur la librairie phonenumbers, dont
  # la region par defaut n'inclut pas FR : un "0612345678" nu n'est pas reconnu.
  - name: FrPhoneRecognizer
    supported_languages:
      - language: fr
        context: [telephone, tel, portable, mobile, fixe, appeler, joignable, numero]
      - language: en
        context: [phone, telephone, mobile, cell]
    type: custom
    supported_entity: FR_PHONE_NUMBER
    patterns:
      - name: fr_phone_international
        regex: '(?:\+33|0033)[\s.-]?[1-9](?:[\s.-]?\d{2}){4}'
        score: 0.7
      - name: fr_phone_national
        regex: '\b0[1-9](?:[\s.-]?\d{2}){4}\b'
        score: 0.6

  # Code postal francais : 5 chiffres, departement 01-98 (hors 00 et 99).
  # Score volontairement bas : tres proche de n'importe quel entier a 5 chiffres.
  - name: FrPostalCodeRecognizer
    supported_languages:
      - language: fr
        context: [code, postal, cp, adresse, ville, commune]
      - language: en
        context: [postal, zip, address]
    type: custom
    supported_entity: FR_POSTAL_CODE
    patterns:
      - name: fr_postal_code
        regex: '\b(?:0[1-9]|[1-8]\d|9[0-8])\d{3}\b'
        score: 0.3

  # SIREN (9 chiffres) / SIRET (14 chiffres) : identifiants d'entreprise.
  - name: FrSiretRecognizer
    supported_languages:
      - language: fr
        context: [siret, siren, entreprise, etablissement, societe, rcs]
      - language: en
        context: [siret, siren, company]
    type: custom
    supported_entity: FR_SIRET
    patterns:
      - name: siret
        regex: '\b\d{14}\b'
        score: 0.4
      - name: siren
        regex: '\b\d{9}\b'
        score: 0.3
