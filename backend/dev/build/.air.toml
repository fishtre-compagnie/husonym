root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["serve", "connect"]
  bin = "./tmp/mgmt"
  cmd = "go build -gcflags=\"all=-N -l\" -o ./tmp/mgmt backend/cmd/mgmt/*.go"
  delay = 1000
  # .claude holds the git worktrees of agents: their checkout would rebuild and restart the process.
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".claude"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = "dlv exec --accept-multiclient --log --headless --continue --listen :2345 ./tmp/mgmt"
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = true
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
