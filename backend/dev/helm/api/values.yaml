image:
  repository: husonym-api

serviceAccount:
  create: true

db:
  host: husonym-postgresql
  name: nucleus
  port: 5432
  username: postgres
  password: foofar
  disableSsl: true

migrations:
  db:
    host: husonym-postgresql
    name: nucleus
    port: 5432
    username: postgres
    password: foofar
    disableSsl: true
    schemaDir: /app/migrations

terminationGracePeriodSeconds: 300
shutdownTimeoutSeconds: 5

istio:
  enabled: false

datadog:
  enabled: false

nucleusEnv: dev

servicePort: 80
containerPort: 8080

auth:
  baseUrl: https://auth.fishtre-compagnie.dev/
  audience: https://api.fishtre-compagnie.com

temporal:
  url: temporal.temporal:7233
  namespace: default
  taskQueue: "sync-job"

ingress:
  enabled: false
