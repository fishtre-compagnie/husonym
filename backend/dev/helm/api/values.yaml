image:
  repository: husonym-api

serviceAccount:
  create: true

db:
  host: husonym-postgresql
  name: husonym
  port: 5432
  username: postgres
  password: foofar
  disableSsl: true

migrations:
  db:
    host: husonym-postgresql
    name: husonym
    port: 5432
    username: postgres
    password: foofar
    disableSsl: true
    schemaDir: /app/migrations

terminationGracePeriodSeconds: 300
shutdownTimeoutSeconds: 5

istio:
  enabled: false

datadog:
  enabled: false

husonymEnv: dev

servicePort: 80
containerPort: 8080

auth:
  # Local Keycloak realm, matching the values used by compose.auth.yml
  baseUrl: http://keycloak:8080/realms/husonym
  audience: husonym

temporal:
  url: temporal.temporal:7233
  namespace: default
  taskQueue: "sync-job"

ingress:
  enabled: false
