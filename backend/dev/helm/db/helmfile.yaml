repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: husonym-postgresql
    chart: bitnami/postgresql
    version: 12.10.0
    namespace: husonym
    createNamespace: false

    values:
      - auth:
          postgresPassword: foofar
          database: nucleus
        primary:
          persistence:
            mountPath: "/husonym/husonym-postgres"
            existingClaim: husonym-postgres # see pvc in ../yaml/husonym-postgres-pvc.yaml
        postgresqlDataDir: "/husonym/husonym-postgres/data"
