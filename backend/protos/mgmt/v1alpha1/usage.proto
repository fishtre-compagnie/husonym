syntax = "proto3";

package mgmt.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "mgmt/v1alpha1/permission.proto";

// How a run ended.
enum RunOutcome {
  RUN_OUTCOME_UNSPECIFIED = 0;
  // The run finished its work.
  RUN_OUTCOME_COMPLETED = 1;
  // The run stopped on an error.
  RUN_OUTCOME_FAILED = 2;
  // The run was told to stop.
  RUN_OUTCOME_CANCELED = 3;
}

message RecordRunStartedRequest {
  // The job the run belongs to. The account and the kind of the run are read from it.
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  // The identifier of the run, as the orchestrator gives it.
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  // When the run began.
  google.protobuf.Timestamp started_at = 3 [(buf.validate.field).required = true];
}
message RecordRunStartedResponse {}

message RecordRunEndedRequest {
  // The job the run belongs to. The account and the kind of the run are read from it.
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  // The identifier of the run, as the orchestrator gives it.
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  // When the run began.
  google.protobuf.Timestamp started_at = 3 [(buf.validate.field).required = true];
  // When the run ended.
  google.protobuf.Timestamp ended_at = 4 [(buf.validate.field).required = true];
  // How the run ended.
  RunOutcome outcome = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The rows the run read from its source.
  int64 rows_read = 6 [(buf.validate.field).int64.gte = 0];
  // The rows the run set aside instead of writing them.
  int64 rows_discarded = 7 [(buf.validate.field).int64.gte = 0];
  // The times the run's activities were tried again.
  int64 retries = 8 [(buf.validate.field).int64.gte = 0];
}
message RecordRunEndedResponse {}

// Holds the counters of what the instance runs.
service UsageService {
  // Tells that a run has begun. Only the worker calls this, with its key.
  rpc RecordRunStarted(RecordRunStartedRequest) returns (RecordRunStartedResponse) {
    option (mgmt.v1alpha1.requires) = {none: true};
  }

  // Tells that a run has ended, and what it did. Only the worker calls this, with its key.
  rpc RecordRunEnded(RecordRunEndedRequest) returns (RecordRunEndedResponse) {
    option (mgmt.v1alpha1.requires) = {none: true};
  }
}
