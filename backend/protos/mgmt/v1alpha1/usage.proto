syntax = "proto3";

package mgmt.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "mgmt/v1alpha1/job.proto";
import "mgmt/v1alpha1/metrics.proto";
import "mgmt/v1alpha1/permission.proto";

// How a run ended.
enum RunOutcome {
  RUN_OUTCOME_UNSPECIFIED = 0;
  // The run finished its work.
  RUN_OUTCOME_COMPLETED = 1;
  // The run stopped on an error.
  RUN_OUTCOME_FAILED = 2;
  // The run was told to stop.
  RUN_OUTCOME_CANCELED = 3;
}

// What kept a run from completing, read from the type of its error and from the code of the database, never from a message.
enum RunErrorCategory {
  RUN_ERROR_CATEGORY_UNSPECIFIED = 0;
  // The database or the network refused the connection, or closed it.
  RUN_ERROR_CATEGORY_CONNECTION_REFUSED = 1;
  // The database refused who connects.
  RUN_ERROR_CATEGORY_AUTHENTICATION_REFUSED = 2;
  // Something took longer than it is allowed to.
  RUN_ERROR_CATEGORY_TIMEOUT = 3;
  // A row broke a constraint of the database.
  RUN_ERROR_CATEGORY_CONSTRAINT_VIOLATED = 4;
  // The database refused what the run is not allowed to do.
  RUN_ERROR_CATEGORY_INSUFFICIENT_PRIVILEGES = 5;
  // A table, a column or another object is not there.
  RUN_ERROR_CATEGORY_OBJECT_MISSING = 6;
  // A value does not fit the type it goes into.
  RUN_ERROR_CATEGORY_TYPE_MISMATCH = 7;
  // Memory, disk space or another resource ran out.
  RUN_ERROR_CATEGORY_RESOURCES_EXHAUSTED = 8;
  // The run was told to stop.
  RUN_ERROR_CATEGORY_CANCELED = 9;
  // The license refused the run.
  RUN_ERROR_CATEGORY_LICENSE = 10;
  // Anything that is none of the above.
  RUN_ERROR_CATEGORY_OTHER = 11;
}

// The step a run was at when it stopped.
enum RunErrorStep {
  RUN_ERROR_STEP_UNSPECIFIED = 0;
  // The checks made before anything is written.
  RUN_ERROR_STEP_PREFLIGHT = 1;
  // The making of the schema of a destination.
  RUN_ERROR_STEP_SCHEMA_INIT = 2;
  // The synchronization of a table.
  RUN_ERROR_STEP_TABLE_SYNC = 3;
  // The hooks run before or after the synchronization.
  RUN_ERROR_STEP_HOOKS = 4;
  // The check of referential integrity.
  RUN_ERROR_STEP_INTEGRITY_CHECK = 5;
  // Any step that is none of the above.
  RUN_ERROR_STEP_OTHER = 6;
}

message RecordRunStartedRequest {
  // The job the run belongs to. The account and the kind of the run are read from it.
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  // The identifier of the run, as the orchestrator gives it.
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  // When the run began.
  google.protobuf.Timestamp started_at = 3 [(buf.validate.field).required = true];
}
message RecordRunStartedResponse {}

message RecordRunEndedRequest {
  // The job the run belongs to. The account and the kind of the run are read from it.
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  // The identifier of the run, as the orchestrator gives it.
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  // When the run began.
  google.protobuf.Timestamp started_at = 3 [(buf.validate.field).required = true];
  // When the run ended.
  google.protobuf.Timestamp ended_at = 4 [(buf.validate.field).required = true];
  // How the run ended.
  RunOutcome outcome = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The rows the run read from its source.
  int64 rows_read = 6 [(buf.validate.field).int64.gte = 0];
  // The rows the run set aside instead of writing them.
  int64 rows_discarded = 7 [(buf.validate.field).int64.gte = 0];
  // The times the run's activities were tried again.
  int64 retries = 8 [(buf.validate.field).int64.gte = 0];
  // The tables of the run whose rows were not counted.
  int64 tables_uncounted = 9 [(buf.validate.field).int64.gte = 0];
  // The major version of the database the run read, as "16" or "8.0". Empty when it is not known.
  string source_version_major = 10 [(buf.validate.field).string.pattern = "^([0-9]{1,3}(\\.[0-9]{1,3})?)?$"];
  // What kept the run from completing. Unspecified when it is not told; a value the service does not know counts as other.
  RunErrorCategory error_category = 11;
  // The step the run was at when it stopped. Unspecified when it is not told; a value the service does not know counts as other.
  RunErrorStep error_step = 12;
}
message RecordRunEndedResponse {}

// What the instance does with its usage report.
enum UsageReportingMode {
  USAGE_REPORTING_MODE_UNSPECIFIED = 0;
  // The report is prepared and sent.
  USAGE_REPORTING_MODE_ONLINE = 1;
  // The report is prepared and kept, to be given as a file.
  USAGE_REPORTING_MODE_OFFLINE_REPORT = 2;
  // The report is prepared and kept. Nothing is sent.
  USAGE_REPORTING_MODE_NONE = 3;
}

// What became of the usage report of a day.
enum UsageReportStatus {
  USAGE_REPORT_STATUS_UNSPECIFIED = 0;
  // The report is kept, and is not to be sent.
  USAGE_REPORT_STATUS_KEPT = 1;
  // The report is waiting to be sent, and no attempt was made yet.
  USAGE_REPORT_STATUS_TO_BE_SENT = 2;
  // The report was sent.
  USAGE_REPORT_STATUS_SENT = 3;
  // The report was tried and could not be sent; it is tried again later.
  USAGE_REPORT_STATUS_NOT_SENT = 4;
}

message GetUsageReportingRequest {
  // The unique identifier of the account that asks.
  string account_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetUsageReportingResponse {
  // What the license key provides for the usage report. Unspecified when no key is in force.
  UsageReportingMode license_mode = 1;
  // The mode in force. Unspecified when no key is in force.
  UsageReportingMode mode = 2;
  // Whether the operator lowered the mode below what the key provides.
  bool below_license = 3;
  // Whether the part of the report that describes the instance is on.
  bool diagnostics = 4;
  // Since when the instance sends its report. Absent when it does not.
  google.protobuf.Timestamp sending_since = 5;
  // When the first report is sent at the earliest: 24 hours after it was prepared. Present while the instance sends, has a report to send and has sent none since it started sending.
  google.protobuf.Timestamp first_send_at = 6;
  // When a report was last sent. Absent when none ever was.
  google.protobuf.Timestamp last_sent_at = 7;
  // Whether the instance sends its report and nothing was sent for 30 days.
  bool silent = 8;
  // What became of the reports of the last 30 days, the newest first.
  repeated UsageReportSummary reports = 9;
}
message UsageReportSummary {
  // The UTC day the report counts.
  mgmt.v1alpha1.Date day = 1;
  UsageReportStatus status = 2;
  // When the report was sent. Absent while it was not.
  google.protobuf.Timestamp sent_at = 3;
  // How many times the report was tried.
  int32 attempts = 4;
}

message GetUsageReportRequest {
  // The unique identifier of the account that asks.
  string account_id = 1 [(buf.validate.field).string.uuid = true];
  // The UTC day of the report: a day of the calendar that is not in the future.
  mgmt.v1alpha1.Date day = 2 [(buf.validate.field).required = true];
}
message GetUsageReportResponse {
  // The report as it is kept, byte for byte.
  string document = 1;
  // The seal of the document.
  string seal = 2;
  // The fingerprint of the key that sealed it.
  string key_fingerprint = 3;
}

message GetUsagePeriodReportRequest {
  // The unique identifier of the account that asks.
  string account_id = 1 [(buf.validate.field).string.uuid = true];
  // The first month of the period, as "2026-01", in UTC.
  string from_month = 2 [(buf.validate.field).string.pattern = "^[0-9]{4}-(0[1-9]|1[0-2])$"];
  // The last month of the period, included: not before the first, not in the future, and at most 24 months in all.
  string to_month = 3 [(buf.validate.field).string.pattern = "^[0-9]{4}-(0[1-9]|1[0-2])$"];
}
message GetUsagePeriodReportResponse {
  // The report for the period, as it was sealed, byte for byte.
  string document = 1;
  // The seal of the document.
  string seal = 2;
  // The fingerprint of the key that sealed it.
  string key_fingerprint = 3;
}

// What a job does, as its runs are counted.
enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  // The job copies the rows of a source to its destinations.
  JOB_KIND_SYNC = 1;
  // The job generates rows.
  JOB_KIND_GENERATE = 2;
  // The job generates rows with a model.
  JOB_KIND_AI_GENERATE = 3;
  // The job looks for personal data in a source. Its runs count no rows.
  JOB_KIND_PII_DETECT = 4;
}

// What the runs counted in a period add up to. A run counts on the day the instance learned of its end; a run still running counts nowhere.
message UsageTotals {
  // The runs whose end was recorded in the period, whatever their status.
  int64 runs = 1;
  // Those that completed. The success rate is this number over the runs less the canceled ones.
  int64 runs_completed = 2;
  // Those that were canceled: they neither succeeded nor failed.
  int64 runs_canceled = 3;
  // The rows the runs read from their sources.
  int64 rows_read = 4;
  // The rows the runs set aside instead of writing them.
  int64 rows_discarded = 5;
  // The runs with a table that reported no row count: their rows are not all counted.
  int64 runs_with_uncounted_rows = 6;
}

// The runs counted on a day of the period.
message UsageDay {
  // The day, in the time zone of the answer.
  mgmt.v1alpha1.Date day = 1;
  int64 rows_read = 2;
  int64 runs = 3;
}

// What the runs of a job add up to in the period.
message JobUsage {
  string job_id = 1;
  string job_name = 2;
  JobKind kind = 3;
  UsageTotals totals = 4;
  // The median duration of the runs that have a known end. Absent when none has.
  optional int64 duration_median_seconds = 5;
}

// The runs that did not complete for a category of error.
message UsageErrorCount {
  RunErrorCategory category = 1;
  int64 runs = 2;
}

// The times the license refused something at a gate.
message GateRefusalCount {
  // The gate: a feature of the license, or one of its limits. A member of a closed list.
  string gate = 1;
  int64 refusals = 2;
}

// A run as the counters hold it.
message RunUsage {
  // The identifier of the run, as the orchestrator gives it.
  string run_id = 1;
  JobRunStatus status = 2;
  google.protobuf.Timestamp started_at = 3;
  // Absent for a run that was settled without a known end.
  google.protobuf.Timestamp ended_at = 4;
  // The rows the run read from its source.
  int64 rows_read = 5;
  // The tables of the run whose rows were not counted.
  int64 tables_uncounted = 6;
  // What kept the run from completing. Unspecified for a run that completed.
  RunErrorCategory error_category = 7;
  // The step the run was at when it stopped. Unspecified for a run that completed.
  RunErrorStep error_step = 8;
}

message GetAccountUsageRequest {
  // The unique identifier of the account.
  string account_id = 1 [(buf.validate.field).string.uuid = true];
  // The first day of the period.
  mgmt.v1alpha1.Date from_day = 2 [(buf.validate.field).required = true];
  // The last day of the period, included: not before the first, and at most 366 days in all.
  mgmt.v1alpha1.Date to_day = 3 [(buf.validate.field).required = true];
  // The IANA name of the time zone the days are counted in, as "Europe/Paris". A name that is empty or not known reads as UTC.
  string time_zone = 4;
}
message GetAccountUsageResponse {
  // Every run of the account counted in the period, those of jobs deleted since among them.
  UsageTotals totals = 1;
  // The sum of the durations of the runs that have a known end. Absent when none has.
  optional int64 duration_total_seconds = 2;
  // Every day of the period, the oldest first; a day without a run is there, at zero.
  repeated UsageDay days = 3;
  // The jobs that have a run counted in the period and still exist, the one that read the most rows first.
  repeated JobUsage jobs = 4;
  // The runs that did not complete, by category, the category with the most runs first.
  repeated UsageErrorCount errors = 5;
  // What the license refused the account, by gate. Refusals are counted by UTC day, whatever the time zone.
  repeated GateRefusalCount refusals = 6;
  // The time zone the days were counted in: the one asked, or "UTC" when it is not known.
  string time_zone = 7;
}

message GetJobUsageRequest {
  // The unique identifier of the account.
  string account_id = 1 [(buf.validate.field).string.uuid = true];
  // The unique identifier of the job. A job that is not of the account has no usage.
  string job_id = 2 [(buf.validate.field).string.uuid = true];
  // The first day of the period.
  mgmt.v1alpha1.Date from_day = 3 [(buf.validate.field).required = true];
  // The last day of the period, included: not before the first, and at most 366 days in all.
  mgmt.v1alpha1.Date to_day = 4 [(buf.validate.field).required = true];
  // The IANA name of the time zone the days are counted in, as "Europe/Paris". A name that is empty or not known reads as UTC.
  string time_zone = 5;
}
message GetJobUsageResponse {
  // What the job does. Unspecified when the account has no such job.
  JobKind kind = 1;
  UsageTotals totals = 2;
  // The median duration of the runs that have a known end. Absent when none has.
  optional int64 duration_median_seconds = 3;
  // Every day of the period, the oldest first; a day without a run is there, at zero.
  repeated UsageDay days = 4;
  // The runs counted in the period, the most recently recorded first, 20 at most.
  repeated RunUsage runs = 5;
  // The time zone the days were counted in: the one asked, or "UTC" when it is not known.
  string time_zone = 6;
}

// Holds the counters of what the instance runs.
service UsageService {
  // Tells that a run has begun. Only the worker calls this, with its key.
  rpc RecordRunStarted(RecordRunStartedRequest) returns (RecordRunStartedResponse) {
    option (mgmt.v1alpha1.requires) = {none: true};
  }

  // Tells that a run has ended, and what it did. Only the worker calls this, with its key.
  rpc RecordRunEnded(RecordRunEndedRequest) returns (RecordRunEndedResponse) {
    option (mgmt.v1alpha1.requires) = {none: true};
  }

  // Tells under which mode the usage report of the instance is sent, and what became of the reports of the last 30 days.
  rpc GetUsageReporting(GetUsageReportingRequest) returns (GetUsageReportingResponse) {
    option (mgmt.v1alpha1.requires) = {
      all_of: [PERMISSION_ACCOUNT_VIEW]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gives the usage report of a day, as it is kept.
  rpc GetUsageReport(GetUsageReportRequest) returns (GetUsageReportResponse) {
    option (mgmt.v1alpha1.requires) = {
      all_of: [PERMISSION_ACCOUNT_VIEW]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Makes the usage report of the instance for a period of months, month by month, and seals it. Needs a license key in force.
  rpc GetUsagePeriodReport(GetUsagePeriodReportRequest) returns (GetUsagePeriodReportResponse) {
    option (mgmt.v1alpha1.requires) = {
      all_of: [PERMISSION_ACCOUNT_VIEW]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gives what the runs of an account add up to over a period of days: its totals, its days, its jobs, its errors and what the license refused it.
  rpc GetAccountUsage(GetAccountUsageRequest) returns (GetAccountUsageResponse) {
    option (mgmt.v1alpha1.requires) = {
      all_of: [PERMISSION_ACCOUNT_VIEW]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gives what the runs of a job of an account add up to over a period of days, and the latest of them.
  rpc GetJobUsage(GetJobUsageRequest) returns (GetJobUsageResponse) {
    option (mgmt.v1alpha1.requires) = {
      all_of: [PERMISSION_ACCOUNT_VIEW]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
