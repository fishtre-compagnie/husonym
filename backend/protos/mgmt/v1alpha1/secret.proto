syntax = "proto3";

package mgmt.v1alpha1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  // Marks a field whose value is a secret.
  //
  // A secret is encrypted at rest, field by field rather than as a whole message, so that
  // what sits next to it stays readable for diagnosis. It is absent from the responses the
  // API sends to a user — a fingerprint stands in its place — and it leaves in clear only
  // towards the worker of a run that needs it.
  //
  // One function reads this option and walks a message to encrypt, decrypt or redact what
  // it marks; nothing encrypts on its own.
  bool secret = 50001;
}
