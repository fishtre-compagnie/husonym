syntax = "proto3";

package mgmt.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "mgmt/v1alpha1/transformer.proto";

message PostgresStreamConfig {}
message MysqlStreamConfig {}
message AwsDynamoDBStreamConfig {}
message AwsS3StreamConfig {
  oneof id {
    // The unique identifier of the job to get the data stream for.
    string job_id = 1 [(buf.validate.field).string.uuid = true];
    // The unique identifier of the job run to get the data stream for.
    string job_run_id = 2 [(buf.validate.field).string.min_len = 1];
  }
}
message GcpCloudStorageStreamConfig {
  oneof id {
    // The unique identifier of the job to get the data stream for.
    string job_id = 1 [(buf.validate.field).string.uuid = true];
    // The unique identifier of the job run to get the data stream for.
    string job_run_id = 2 [(buf.validate.field).string.min_len = 1];
  }
}

message ConnectionStreamConfig {
  oneof config {
    option (buf.validate.oneof).required = true;

    PostgresStreamConfig pg_config = 1;
    AwsS3StreamConfig aws_s3_config = 2;
    MysqlStreamConfig mysql_config = 3;
    GcpCloudStorageStreamConfig gcp_cloudstorage_config = 4;
    AwsDynamoDBStreamConfig dynamodb_config = 5;
  }
}

message GetConnectionDataStreamRequest {
  // The unique identifier of the connection to get the data stream for.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The stream configuration to use for the data stream.
  ConnectionStreamConfig stream_config = 2;
  // The schema of the table to get the data stream for.
  string schema = 3;
  // The table to get the data stream for.
  string table = 4;
}

// Each stream response is a single row in the requested schema and table
message GetConnectionDataStreamResponse {
  reserved 1; // Was: map<string, bytes> row = 1;
  // A map of column name to column value, where the value is serialized as bytes. The value represents a map[string]any structure.
  bytes row_bytes = 2;
}

message PostgresSchemaConfig {}
message MysqlSchemaConfig {}
message MssqlSchemaConfig {}
message AwsS3SchemaConfig {
  oneof id {
    // The unique identifier of the job to get the schema for.
    string job_id = 1 [(buf.validate.field).string.uuid = true];
    // The unique identifier of the job run to get the schema for.
    string job_run_id = 2 [(buf.validate.field).string.min_len = 1];
  }
}
message MongoSchemaConfig {}
message DynamoDBSchemaConfig {}
message GcpCloudStorageSchemaConfig {
  oneof id {
    // The unique identifier of the job to get the schema for.
    string job_id = 1 [(buf.validate.field).string.uuid = true];
    // The unique identifier of the job run to get the schema for.
    string job_run_id = 2 [(buf.validate.field).string.min_len = 1];
  }
}

message ConnectionSchemaConfig {
  oneof config {
    option (buf.validate.oneof).required = true;

    PostgresSchemaConfig pg_config = 1;
    AwsS3SchemaConfig aws_s3_config = 2;
    MysqlSchemaConfig mysql_config = 3;
    MongoSchemaConfig mongo_config = 4;
    GcpCloudStorageSchemaConfig gcp_cloudstorage_config = 5;
    DynamoDBSchemaConfig dynamodb_config = 6;
    MssqlSchemaConfig mssql_config = 7;
  }
}

// Niveau de confiance d'une détection RGPD. Il n'est PAS dérivé d'un score : il
// dit COMMENT la détection a été obtenue, ce qui détermine si on peut agir seul.
enum PiiConfidence {
  PII_CONFIDENCE_UNSPECIFIED = 0;
  // Preuve déterministe : heuristique nom+type, ou clé de contrôle vérifiée
  // (NIR mod 97, IBAN mod 97, Luhn...) sur la quasi-totalité de l'échantillon.
  // Le transformer suggéré peut être appliqué automatiquement.
  PII_CONFIDENCE_CONFIRMED = 1;
  // Indice non prouvé : modèle statistique (Presidio/NER), clé de contrôle
  // valide sur une partie seulement, ou format de date indécidable.
  // À signaler à l'utilisateur pour levée de doute, sans rien appliquer.
  PII_CONFIDENCE_NEEDS_REVIEW = 2;
}

// Origine d'une détection RGPD. Sert à expliquer la décision à l'utilisateur.
enum PiiDetectionMethod {
  PII_DETECTION_METHOD_UNSPECIFIED = 0;
  // Nom de la colonne + type SQL, sans lecture de données.
  PII_DETECTION_METHOD_COLUMN_NAME = 1;
  // Clé de contrôle vérifiée sur les valeurs échantillonnées.
  PII_DETECTION_METHOD_CHECKSUM = 2;
  // Reconnaissance d'entités par Presidio sur les valeurs échantillonnées.
  PII_DETECTION_METHOD_CONTENT = 3;
  // Format inféré depuis les valeurs (ex: date jj/mm/aaaa).
  PII_DETECTION_METHOD_FORMAT = 4;
}

message DatabaseColumn {
  // The database schema. Ex: public
  string schema = 1;
  // The name of the table in the schema
  string table = 2;
  // The name of the column
  string column = 3;
  // The datatype of the column
  string data_type = 4;
  // The isNullable Flag of the column
  string is_nullable = 5;
  // The default value of the column if available
  optional string column_default = 6;
  // Populated if the column is generated. The value is the type of generated column it is. For example, postgres is 's' for stored
  // May be other values in the future, or other DB providers may use a different value types.
  optional string generated_type = 7;
  // Populated if the column is an identity. The value is the type of the identity column it is. For example, postgres is 'd' for generated by default, or 'a' for generated always.
  optional string identity_generation = 8;
  // How many characters the column accepts, when its type bounds them. Absent for types that
  // bound nothing. It cannot be read back from data_type: MySQL reports `varchar` there and
  // keeps the length in column_type, so anything parsing data_type finds no bound on MySQL.
  optional int32 character_maximum_length = 15;
  // Nature sémantique détectée pour cette colonne (heuristique nom+type SQL). Ex: "email", "phone_number", "person_full_name". Vide si rien de détecté.
  string data_category = 9;
  // True si la colonne est considérée comme une donnée à caractère personnel (RGPD).
  bool is_sensitive = 10;
  // Transformer recommandé pour anonymiser cette colonne. TRANSFORMER_SOURCE_UNSPECIFIED si aucune suggestion.
  TransformerSource suggested_transformer_source = 11;
  // Niveau de confiance de la détection. Seul CONFIRMED autorise l'application
  // automatique du transformer suggéré.
  PiiConfidence pii_confidence = 12;
  // Comment la détection a été obtenue.
  PiiDetectionMethod pii_detection_method = 13;
  // Détail lisible de la preuve, pour l'infobulle. Ex: "clé NIR valide sur 18/18 valeurs",
  // "format jj/mm/aaaa prouvé (14 valeurs avec jour > 12)", "format ambigu : jj/mm ou mm/jj".
  string pii_evidence = 14;
}

message GetConnectionSchemaRequest {
  // The unique identifier of the connection to get the schema for.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The schema configuration to use for the schema map.
  ConnectionSchemaConfig schema_config = 2;
}

message GetConnectionSchemaResponse {
  // The list of database columns
  repeated DatabaseColumn schemas = 1;
}

message GetConnectionSchemaMapRequest {
  // The unique identifier of the connection to get the schema map for.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The schema configuration to use for the schema map.
  ConnectionSchemaConfig schema_config = 2;
}

message GetConnectionSchemaMapResponse {
  // Returns the database columns separated by the fully qualified <schema>.<table>
  map<string, GetConnectionSchemaResponse> schema_map = 1;
}

message GetConnectionSchemaMapsRequest {
  // List of connection schema maps to request
  repeated GetConnectionSchemaMapRequest requests = 1;
}

message GetConnectionSchemaMapsResponse {
  // List of responses in the same order as the input
  repeated GetConnectionSchemaMapResponse responses = 1;
  // Parallel array of each connection id that matches with the response
  repeated string connection_ids = 2;
}

message ForeignKey {
  // The table that the foreign key is associated with
  string table = 1;
  reserved 2; // Was: string column = 2;
  // The columns that are part of the foreign key
  repeated string columns = 3;
}

message ForeignConstraint {
  reserved 1; // Was: string column = 1;
  reserved 2; // Was: bool is_nullable = 2;
  // The foreign key that is associated with the constraint
  ForeignKey foreign_key = 3;
  // The columns that are part of the constraint
  repeated string columns = 4;
  // The not nullable flag for each column
  repeated bool not_nullable = 5;
}

message ForeignConstraintTables {
  // A list of foreign key constraints
  repeated ForeignConstraint constraints = 1;
}

message InitStatementOptions {
  // Whether or not to generate schema init statements.
  bool init_schema = 1;
  // Whether or not to generate truncation statements
  bool truncate_before_insert = 2;
  // Whether or not to generate truncate cascade statements.
  bool truncate_cascade = 3;
}
message GetConnectionInitStatementsRequest {
  // The unique identifier of the connection to get the init statements for.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The options to use for the init statements.
  InitStatementOptions options = 2;
}

message SchemaInitStatements {
  // A friendly label associated with the generated schema init statement(s)
  string label = 1;
  // A list of SQL statements that may be used to initialize a database from scratch.
  repeated string statements = 2;
}

// Init statement for a specific table
message GetConnectionInitStatementsResponse {
  reserved 1;
  reserved "table_init_statements"; // replaced by schema_init_statements
  // The key here is <schema>.<table> and value is the table truncate statement.
  map<string, string> table_truncate_statements = 2;
  // A list of schema initialization statements
  repeated SchemaInitStatements schema_init_statements = 3;
}

message PrimaryConstraint {
  // The columns that are part of the primary constraint
  repeated string columns = 1;
}

message UniqueConstraint {
  // The columns that are part of the unique constraint
  repeated string columns = 1;
}

message GetAiGeneratedDataRequest {
  // The unique identifier of a connection, specifically one that is configured for LLM use.
  string ai_connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The number of records to generate
  int64 count = 2 [
    (buf.validate.field).int64.gte = 1,
    (buf.validate.field).int64.lte = 10
  ];
  // The LLM model name to use that works with the configured connection id.
  string model_name = 3 [(buf.validate.field).string.min_len = 1];
  // The prompt that will be used to further refine the data generation. This is appended to the prompt that Husonym generates that includes schema information.
  optional string user_prompt = 4;
  // The unique identifier of a connection that the AI generated data would be inserted into. This is used to generate and send schema information to the LLM to help shape the generated data.
  string data_connection_id = 5 [(buf.validate.field).string.uuid = true];
  // The table to generate data for.
  DatabaseTable table = 6;
}

message DatabaseTable {
  // The schema of the table
  string schema = 1 [(buf.validate.field).string.min_len = 1];
  // The table name
  string table = 2 [(buf.validate.field).string.min_len = 1];
}

message GetAiGeneratedDataResponse {
  // A list of generated records
  repeated google.protobuf.Struct records = 1;
}

message GetConnectionTableConstraintsRequest {
  // The unique identifier of the connection to get the constraints for.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
}

message UniqueConstraints {
  // The unique constraints found for the table
  repeated UniqueConstraint constraints = 1;
}

message UniqueIndexes {
  // The unique indexes found for the table
  repeated UniqueIndex indexes = 1;
}

message UniqueIndex {
  // The columns that are part of the unique index
  repeated string columns = 1;
}

message GetConnectionTableConstraintsResponse {
  // the key here is <schema>.<table> and the list of tables that it depends on, also `<schema>.<table>` format.
  map<string, ForeignConstraintTables> foreign_key_constraints = 1;
  // the key here is <schema>.<table> and value is the primary constraint
  map<string, PrimaryConstraint> primary_key_constraints = 2;
  // the key here is <schema>.<table> and value is the unique constraint
  map<string, UniqueConstraints> unique_constraints = 3;
  // the key here is <schema>.<table> and value is the unique index
  map<string, UniqueIndexes> unique_indexes = 4;
}

message GetTableRowCountRequest {
  // The unique identifier of the connection to get the row count for.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The schema of the table to get the row count for.
  string schema = 2 [(buf.validate.field).string.min_len = 1];
  // The table to get the row count for.
  string table = 3 [(buf.validate.field).string.min_len = 1];
  // The optional where clause to filter the rows by.
  optional string where_clause = 4;
}

message GetTableRowCountResponse {
  // The count of the rows in the table
  int64 count = 1;
}

// Request to get all the schemas and tables for a connection
message GetAllSchemasAndTablesRequest {
  // The unique identifier of the connection to get the all schema tables for.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
}

// A list of all the schemas and tables for a connection
message GetAllSchemasAndTablesResponse {
  // A list of all the schemas for a connection. Empty schemas (those without any tables) will appear in this list.
  repeated Schema schemas = 1;
  // A list of all the tables for the connection
  repeated Table tables = 2;

  // A schema
  message Schema {
    // The name of the schema
    string name = 1;
  }
  // A table in a schema
  message Table {
    // The name of the schema
    string schema_name = 1;
    // The name of the table
    string table_name = 2;
  }
}

message DetectPiiInConnectionDataRequest {
  // The unique identifier of the connection to scan.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The schema of the table to scan.
  string schema = 2 [(buf.validate.field).string.min_len = 1];
  // The table to scan.
  string table = 3 [(buf.validate.field).string.min_len = 1];
  // Columns to analyze. Empty means every column of the table.
  repeated string columns = 4;
  // Number of sampled values per column (default 20).
  uint32 sample_size = 5;
  // Presidio score threshold in [0,1] (default 0.5).
  float score_threshold = 6;
  // Content language (ISO 639-1). Default: server default or "en".
  string language = 7;
}

// PII detected in a column by analyzing sampled content (Presidio).
message ColumnPiiDetection {
  string schema = 1;
  string table = 2;
  string column = 3;
  // Dominant Presidio entity type detected (ex: EMAIL_ADDRESS). Empty if none.
  string entity_type = 4;
  // Average score of the detected entity in [0,1].
  float score = 5;
  // Recommended transformer for this entity.
  TransformerSource suggested_transformer_source = 6;
  // True if the column is considered personal data (GDPR).
  bool is_sensitive = 7;
  // Number of sampled values in which the entity was found.
  uint32 match_count = 8;
  // Total number of non-empty sampled values analyzed.
  uint32 sampled_count = 9;
  // Catégorie sémantique déduite de l'entité (ex: "email", "nir"). Alimente le libellé du badge.
  string data_category = 10;
  // Niveau de confiance. Une détection issue d'une clé de contrôle est CONFIRMED,
  // une détection Presidio est NEEDS_REVIEW.
  PiiConfidence pii_confidence = 11;
  // Comment la détection a été obtenue.
  PiiDetectionMethod pii_detection_method = 12;
  // Détail lisible de la preuve, pour l'infobulle.
  string pii_evidence = 13;
}

// The verdict on one column: what its name says and what its content showed, reconciled by
// the server, so that every caller — the UI, the CLI, an agent — is told the same thing.
message ColumnPiiVerdict {
  string schema = 1;
  string table = 2;
  string column = 3;
  // True if the column is considered personal data (GDPR).
  bool is_sensitive = 4;
  // What the data is (ex: "email", "nir"). Empty if nothing was recognized.
  string data_category = 5;
  // Recommended transformer. TRANSFORMER_SOURCE_UNSPECIFIED when none fits.
  TransformerSource suggested_transformer_source = 6;
  // Only CONFIRMED allows the suggested transformer to be applied without a person.
  PiiConfidence pii_confidence = 7;
  // How the verdict was reached.
  PiiDetectionMethod pii_detection_method = 8;
  // The proof, in words, for the tooltip.
  string pii_evidence = 9;
}

message DetectPiiInConnectionDataResponse {
  // What the content scan found, column by column, before reconciling with the names.
  repeated ColumnPiiDetection detections = 1;
  // One verdict per column of the table (or per requested column), name and content
  // reconciled. A column the scan found nothing in still has one, from its name alone.
  repeated ColumnPiiVerdict verdicts = 2;
}

// Échantillon des valeurs d'une colonne, pour lever un doute sur une détection
// RGPD en regardant les données réelles.
message GetColumnSampleValuesRequest {
  // The unique identifier of the connection to read from.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The schema of the table.
  string schema = 2 [(buf.validate.field).string.min_len = 1];
  // The table to read.
  string table = 3 [(buf.validate.field).string.min_len = 1];
  // The column whose values are returned.
  string column = 4 [(buf.validate.field).string.min_len = 1];
  // Number of rows to return (default 20, max 200).
  uint32 limit = 5;
}

message ColumnSampleValue {
  // Représentation textuelle de la valeur. Vide si is_null.
  string value = 1;
  // Distingue un NULL d'une chaîne vide — la différence compte pour juger d'une
  // colonne (« vide » et « absent » ne se traitent pas pareil).
  bool is_null = 2;
}

message GetColumnSampleValuesResponse {
  repeated ColumnSampleValue values = 1;
}

// What a drafted rule derives its output from.
enum JavascriptDraftMode {
  // Defaults to transform.
  JAVASCRIPT_DRAFT_MODE_UNSPECIFIED = 0;
  // The rule receives the current value and derives the new one from it.
  JAVASCRIPT_DRAFT_MODE_TRANSFORM = 1;
  // The rule ignores the current value and produces a new one.
  JAVASCRIPT_DRAFT_MODE_GENERATE = 2;
}

// The engine that will run the drafted rule. It decides what the rule may call: the
// deterministic pseudo functions exist under Athanor only, and calling one under Benthos fails
// at runtime, so a draft written for the wrong engine is a run that breaks.
enum JavascriptDraftEngine {
  // Defaults to athanor, the default engine.
  JAVASCRIPT_DRAFT_ENGINE_UNSPECIFIED = 0;
  JAVASCRIPT_DRAFT_ENGINE_ATHANOR = 1;
  JAVASCRIPT_DRAFT_ENGINE_BENTHOS = 2;
}

message GetJavascriptDraftPromptRequest {
  // The connection whose schema describes the column.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The schema of the table.
  string schema = 2 [(buf.validate.field).string.min_len = 1];
  // The table the column belongs to.
  string table = 3 [(buf.validate.field).string.min_len = 1];
  // The column a rule is being drafted for.
  string column = 4 [(buf.validate.field).string.min_len = 1];
  // What the rule derives its output from. Defaults to transform.
  JavascriptDraftMode mode = 5;
  // The engine that will run it. Unspecified means athanor — a product choice, not the
  // deployment's state: ENABLE_ATHANOR_ENGINE is off by default and only the worker reads it,
  // so the server cannot observe which engine a job will get. Athanor is where the product is
  // going and Benthos is on its way out, so a caller on a Benthos deployment says so.
  JavascriptDraftEngine engine = 6;
}

message PreviewColumnTransformerRequest {
  // The connection to read the column from.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // The schema of the table.
  string schema = 2 [(buf.validate.field).string.min_len = 1];
  // The table to read.
  string table = 3 [(buf.validate.field).string.min_len = 1];
  // The column whose values are transformed.
  string column = 4 [(buf.validate.field).string.min_len = 1];
  // The transformer to try on them.
  TransformerConfig transformer = 5 [(buf.validate.field).required = true];
  // Number of rows to read (default 20, max 50).
  uint32 limit = 6;
}

// One sampled value and what the transformer made of it.
message ColumnTransformerPreview {
  // The value as read from the source.
  ColumnSampleValue input = 1;
  // What the transformer produced. Unset when it failed on this value.
  optional ColumnSampleValue output = 2;
  // Why the transformer failed on this value, when it did.
  optional string error = 3;
}

message PreviewColumnTransformerResponse {
  repeated ColumnTransformerPreview values = 1;
  // Distinct non-null values in the sample, before and after. Fewer after than before means the
  // transformer sends different values to the same one — which a column under a uniqueness
  // constraint cannot take. It is a sign, never a proof: a sample this small says nothing
  // certain about the whole table.
  uint32 distinct_inputs = 2;
  uint32 distinct_outputs = 3;
}

message GetJavascriptDraftPromptResponse {
  // The prompt, ready to send to a model. It carries the execution contract, the column's
  // constraints and the functions in scope — never any of the column's values.
  string prompt = 1;
}

// Service for managing connection data.
// This is used in handle data from a connection
service ConnectionDataService {
  // Streaming endpoint that will stream the data available from the Connection to the client.
  // Used primarily by the CLI sync command.
  rpc GetConnectionDataStream(GetConnectionDataStreamRequest) returns (stream GetConnectionDataStreamResponse) {}
  // Returns the schema for a specific connection. Used mostly for SQL-based connections
  rpc GetConnectionSchema(GetConnectionSchemaRequest) returns (GetConnectionSchemaResponse) {}
  // Returns the schema in map format. The keys are the fully qualified table in the format <schema>.<table>
  rpc GetConnectionSchemaMap(GetConnectionSchemaMapRequest) returns (GetConnectionSchemaMapResponse) {}
  // Returns the schema in map format for every request provided
  rpc GetConnectionSchemaMaps(GetConnectionSchemaMapsRequest) returns (GetConnectionSchemaMapsResponse) {}
  // For a specific connection, returns the table constraints. Mostly useful for SQL-based Connections.
  rpc GetConnectionTableConstraints(GetConnectionTableConstraintsRequest) returns (GetConnectionTableConstraintsResponse) {}
  // For a specific connection, returns the init table statements. Mostly useful for SQL-based Connections.
  // Used primarily by the CLI sync command to create table schema init statement.
  rpc GetConnectionInitStatements(GetConnectionInitStatementsRequest) returns (GetConnectionInitStatementsResponse) {}
  // Query an AI connection by providing the necessary values. Typically used for generating preview data
  rpc GetAiGeneratedData(GetAiGeneratedDataRequest) returns (GetAiGeneratedDataResponse) {}
  // Query table with subset to get row count
  rpc GetTableRowCount(GetTableRowCountRequest) returns (GetTableRowCountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Get all schemas and tables for a connection
  rpc GetAllSchemasAndTables(GetAllSchemasAndTablesRequest) returns (GetAllSchemasAndTablesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Scans sampled column content through Presidio to detect PII (deep scan).
  // Complements the name-based heuristic returned by GetConnectionSchema.
  rpc DetectPiiInConnectionData(DetectPiiInConnectionDataRequest) returns (DetectPiiInConnectionDataResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Retourne un échantillon des valeurs d'une colonne, pour lever un doute sur
  // une détection RGPD en consultant les données réelles.
  rpc GetColumnSampleValues(GetColumnSampleValuesRequest) returns (GetColumnSampleValuesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the prompt that gets a javascript rule drafted for one column, by an agent or by a
  // model. The server fills it from what it knows and the caller does not: the execution
  // contract of the sandbox, the column's type, nullability, uniqueness and foreign keys, and
  // the deterministic functions in scope. It reads the schema, never the column's data.
  rpc GetJavascriptDraftPrompt(GetJavascriptDraftPromptRequest) returns (GetJavascriptDraftPromptResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Reads a sample of one column and shows what a transformer would make of each value, before
  // anyone commits to it. The server reads the values itself: this previews a real column, and
  // cannot be turned into an unmetered way to anonymize arbitrary data.
  rpc PreviewColumnTransformer(PreviewColumnTransformerRequest) returns (PreviewColumnTransformerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
