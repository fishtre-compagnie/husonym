apiVersion: v1
kind: Service
metadata:
  name: {{ template "husonym-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "husonym-worker.labels" . | nindent 4 }}
    app: {{ template "husonym-worker.fullname" . }}
spec:
  ports:
    - name: grpc # this is important!!! If it is anything other than "grpc", grpc routing will not work (at least when used with Istio) https://istiobyexample.dev/grpc/
      port: {{ .Values.servicePort }}
      protocol: TCP
      targetPort: {{ .Values.containerPort }}
  selector:
    app: {{ template "husonym-worker.fullname" . }}
